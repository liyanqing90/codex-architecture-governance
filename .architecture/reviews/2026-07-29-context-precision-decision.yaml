problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - traceability
  constraints:
    - The eight public Skill identities and the local-first plugin runtime remain compatibility contracts.
    - Legacy trusted artifacts remain readable; new contracts must fail closed without rewriting historical evidence.
    - The project has no required hosted runtime, credentials, telemetry, or external service.
  finding_ids: []
  assumptions:
    - The 0.4.2 context-precision work remains a compatible extension to the local deterministic runtime.
    - A static, non-executing setup.py parser is sufficient for literal runtime dependency declarations.
  known_facts:
    - The verified review resolved source and test evidence for static setup.py parsing and comparable Base/Full/Compressed treatments.
    - The migration introduces versioned schemas, explicit facts roles, and a declared context proxy without claiming new external-model results.
    - Full and Compressed treatments share workflow-required Knowledge while Base loads none.
  unknowns:
    - Downstream adoption and real external-model A/B/C outcome differences are not yet observed.
