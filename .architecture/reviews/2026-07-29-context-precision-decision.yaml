options:
  - id: keep-current
    title: Keep the local-first plugin topology and enforce compatible contracts
    complexity_tier: keep-current
    architecture_styles: []
    patterns: []
    technologies: []
    benefits:
      - Preserves the local Python CLI and existing public Skill boundaries.
      - Makes facts roles, A/B/C treatments, and context accounting explicit and testable.
    liabilities:
      - Maintainers must continue to keep schema migrations and governance artifacts synchronized.
    assumptions:
      - The current repository-scale runtime remains suitable for the intended open-source workflow.
    quality_attribute_effects:
      - {attribute: compatibility, effect: improves, rationale: Legacy artifacts remain readable while new contracts are versioned and documented.}
      - {attribute: deterministic-enforcement, effect: improves, rationale: Static parsing and exact treatment sets fail before they can create ambiguous results.}
      - {attribute: traceability, effect: improves, rationale: Context inputs and review evidence bind to explicit paths and hashes.}
    business_fit: Fits the installable open-source plugin and constrained operating model.
    team_fit: Uses existing Python, schema, test, and release practices.
    evolution_fit: Retains bounded internal seams without introducing a distributed runtime.
    implementation_complexity: low
    operational_complexity: low
    migration_risk: low
    reversibility: easy
    cost: low
    technical_maturity: mature
    lock_in: none
    tradeoff_scores:
      business_fit: 2
      quality_fit: 2
      team_fit: 2
      implementation: 2
      operations: 2
      migration: 2
      reversibility: 2
      cost: 2
      maturity: 2
      lock_in: 2
      evolution: 1
    rejected_reasons: []
  - id: permissive-inputs
    title: Accept dynamic dependency declarations and incomplete treatment manifests
    complexity_tier: low
    architecture_styles: []
    patterns: []
    technologies: []
    benefits:
      - Reduces up-front validation work for unusual repository layouts.
    liabilities:
      - Allows hidden execution behavior or incomparable benchmark treatments to influence governance output.
    assumptions:
      - Consumers can reliably interpret ambiguities without deterministic enforcement.
    quality_attribute_effects:
      - {attribute: compatibility, effect: degrades, rationale: Different callers may infer different facts or treatment meanings from the same input.}
      - {attribute: deterministic-enforcement, effect: degrades, rationale: Validation no longer rejects duplicate or incomplete A/B/C declarations.}
      - {attribute: traceability, effect: degrades, rationale: Dynamic behavior cannot be attributed to a bounded inspected input.}
    business_fit: Conflicts with the project's evidence-first published governance contracts.
    team_fit: Shifts ambiguity resolution to every maintainer and reviewer.
    evolution_fit: Creates future compatibility debt at the schema boundary.
    implementation_complexity: low
    operational_complexity: low
    migration_risk: high
    reversibility: moderate
    cost: low
    technical_maturity: mature
    lock_in: none
    tradeoff_scores:
      business_fit: -2
      quality_fit: -2
      team_fit: -1
      implementation: 1
      operations: 1
      migration: -2
      reversibility: 0
      cost: 1
      maturity: 1
      lock_in: 2
      evolution: -2
    rejected_reasons:
      - It violates deterministic-enforcement and traceability requirements.
  - id: separate-governance-runtime
    title: Extract inspection and benchmark governance into a hosted service
    complexity_tier: high
    architecture_styles: []
    patterns: []
    technologies: []
    benefits:
      - Could centralize execution for a future multi-user governance product.
    liabilities:
      - Adds identity, tenancy, availability, deployment, cost, and on-call responsibilities absent from the current product.
    assumptions:
      - A hosted product, operating team, and funded demand exist.
    quality_attribute_effects:
      - {attribute: compatibility, effect: degrades, rationale: A remote service changes the local plugin's public operating boundary.}
      - {attribute: deterministic-enforcement, effect: unknown, rationale: Distributed execution adds environmental sources of variation without current evidence of benefit.}
      - {attribute: traceability, effect: unknown, rationale: A new service could add central records but also adds remote identity and deployment provenance.}
    business_fit: Does not fit the current installable, offline-capable plugin.
    team_fit: Requires operating capabilities outside the declared maintainer model.
    evolution_fit: Optimizes an unvalidated future instead of the current bounded contracts.
    implementation_complexity: high
    operational_complexity: high
    migration_risk: high
    reversibility: difficult
    cost: high
    technical_maturity: mature
    lock_in: high
    tradeoff_scores:
      business_fit: -2
      quality_fit: -1
      team_fit: -2
      implementation: -2
      operations: -2
      migration: -2
      reversibility: -1
      cost: -2
      maturity: 2
      lock_in: -2
      evolution: -1
    rejected_reasons:
      - The Profile prohibits a required hosted runtime and no product demand justifies the operating cost.
selected_option: keep-current
rationale: >-
  The verified review shows that the needed corrections belong at existing
  parser and benchmark-contract boundaries. Keeping the local-first plugin
  topology while versioning those contracts restores determinism and
  traceability without inventing a hosted runtime or making unbounded dynamic
  inputs authoritative.
revisit_triggers:
  - A verified downstream migration shows that a supported literal setup.py form is not represented by the static parser.
  - An external-model A/B/C study exposes a context-boundary failure not covered by the declared treatment contract.
  - A funded multi-user product has named security, tenancy, availability, and on-call owners.
acceptance_evidence:
  - The authorized architecture owner accepted the compatible local-first option for the 0.4.2 migration.
  - The candidate and verified review bind source, test, facts, profile, Knowledge, and Rule Pack evidence to commit 3b7cc5c.
hard_eliminations:
  - option_id: separate-governance-runtime
    rule: The project requires a local-first runtime and prohibits a required hosted service.
    evidence:
      - .architecture/profile.yaml declares full offline operation and a prohibited required hosted runtime.
      - .architecture/constraints.md requires no network, credentials, telemetry, or external service for runtime behavior.
migration:
  affected_paths:
    - docs/migrating-to-0.4.2.md
    - resources/schemas/benchmark-context-manifest.schema.json
    - resources/schemas/benchmark.schema.json
    - resources/schemas/gate-policy.schema.json
    - resources/schemas/governance-run-manifest.schema.json
    - resources/schemas/knowledge-selection.schema.json
    - resources/schemas/project-profile.schema.json
    - resources/schemas/repository-facts.schema.json
  slices:
    - Preserve legacy artifact readers while making new facts, selection, policy, and benchmark contracts explicit.
    - Reject ambiguous setup.py and A/B/C manifest inputs before they influence profiles or benchmark interpretation.
    - Publish the migration guide and retain historical v0.4.0 evidence unchanged.
  rollback: >-
    Revert only the new routing and validation paths in a follow-up compatible
    release; retain archived evidence and never rewrite trusted historical
    artifacts.
  validation:
    - Validate repository contracts, project configuration, Knowledge selection, candidate and verified review bindings, and accepted decision links.
    - Run focused regressions, the full test suite, lint, formatting, dependency and license audits, deterministic packaging, checksum verification, and SPDX generation.
