problem:
  quality_attributes:
    - compatibility
    - deterministic-enforcement
    - traceability
  constraints:
    - The eight public Skill identities and the local-first plugin runtime remain compatibility contracts.
    - Historical artifacts remain readable and cannot be reinterpreted by a future Selector.
    - The runtime requires no hosted service, credentials, telemetry, or implicit network access.
    - Public schema and migration changes require a source-bound Review and compatible migration evidence.
  finding_ids: []
  assumptions:
    - Repository-scale selection artifacts remain within ordinary local and CI budgets.
    - Creation-time replay is the daily validation path; archival replay can remain an explicit high-assurance workflow.
  known_facts:
    - The verified Review confirms exact dependency names, role-aware facts, creation-time Selection locking, semantic decision intents, and complete A/B/C treatment contracts.
    - The reviewed implementation commit is a remotely reachable direct descendant of main and contains all critical code changes.
    - The decision selection explicitly binds plugin-runtime-topology and includes Plugin Architecture Knowledge.
    - No client data-authority, optimistic-update, or client-state Knowledge appears in the decision selection.
  unknowns:
    - Downstream schema 1.3 adoption and historical migration experience are not yet observed.
    - No new external-model A/B/C quality, token, cost, or tool-use result is available.
    - GitHub Dependency Graph enablement remains an external repository setting.
