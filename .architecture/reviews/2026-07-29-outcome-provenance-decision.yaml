problem:
  quality_attributes: [compatibility, deterministic-enforcement, traceability]
  constraints:
    - Existing historical Review, Decision, Plan, and Selection artifacts remain inspectable without being rewritten.
    - A new trusted chain cannot claim an archived selected/excluded partition as replayed when only source bytes were verified.
    - Public Skills validate compact model context before consuming it.
    - Selector and reviewed implementation Git commits remain reachable after merge and release.
    - Repository settings require separate authorization.
  finding_ids: []
  assumptions:
    - The local Git repository remains the provenance resolver for schema 1.4 archived source bytes.
    - Merge Commit remains available for integrating the reviewed pull request.
  known_facts:
    - The verified Review resolves nine Git-bound evidence records at remote implementation commit cf254fa.
    - New-chain entry points require current deterministic Selection replay.
    - Compact Context validation rejects lock, result, field, and order tampering.
    - CI and release checkouts use full history and validate both source anchors.
  unknowns:
    - Human V3 acceptance remains pending and is not represented by the V2 agent Review.
    - Production-selected A/B/C outcomes remain unmeasured.
