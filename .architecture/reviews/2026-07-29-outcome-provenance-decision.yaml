options:
  - id: keep-current
    title: Keep the local plugin and separate historical readability from new-chain trust
    complexity_tier: keep-current
    architecture_styles: [style.plugin-architecture]
    patterns: []
    technologies: [technology.import-linter]
    benefits:
      - Restores outcome provenance without executing archived code.
      - Preserves supported historical readability and the local plugin model.
      - Makes compact Context and Git ancestry checks deterministic.
    liabilities:
      - Maintainers regenerate a Selection after a Selector Runtime change before creating new trust.
      - Source-anchored pull requests require Merge Commit and full history.
    assumptions:
      - Current replay remains the routine new-governance path.
    quality_attribute_effects:
      - {attribute: compatibility, effect: improves, rationale: "Historical artifacts stay inspectable while new chains fail closed."}
      - {attribute: deterministic-enforcement, effect: improves, rationale: "New chains require current replay and exact Context projection."}
      - {attribute: traceability, effect: improves, rationale: "CI and release commits retain both source anchors."}
    business_fit: Preserves the installable open-source plugin and adds no hosted dependency.
    team_fit: Uses existing Python validators, Skills, tests, Git, and CI.
    evolution_fit: Keeps archived replay and attestation resolvers as additive extensions.
    implementation_complexity: low
    operational_complexity: low
    migration_risk: low
    reversibility: easy
    cost: low
    technical_maturity: mature
    lock_in: none
    tradeoff_scores: {business_fit: 2, quality_fit: 2, team_fit: 2, implementation: 2, operations: 2, migration: 2, reversibility: 2, cost: 2, maturity: 2, lock_in: 2, evolution: 2}
    rejected_reasons: []
  - id: execute-archived-selector
    title: Reconstruct and execute every archived Selector Runtime
    complexity_tier: medium
    architecture_styles: [style.plugin-architecture]
    patterns: []
    technologies: []
    benefits:
      - Can reproduce an archived partition when the complete environment is reconstructible.
    liabilities:
      - Executes old code during validation and expands the security boundary.
      - Requires long-term dependency and interpreter retention.
    assumptions:
      - Every historical runtime remains safely reconstructible.
    quality_attribute_effects:
      - {attribute: compatibility, effect: improves, rationale: "Exact reconstruction can reproduce old behavior."}
      - {attribute: deterministic-enforcement, effect: improves, rationale: "Archived execution can attest an old outcome."}
      - {attribute: traceability, effect: degrades, rationale: "Routine validation depends on host reconstruction and old code."}
    business_fit: Disproportionate for a repository-scale local plugin.
    team_fit: Requires sandbox and environment ownership not present today.
    evolution_fit: Could become an optional high-assurance verifier.
    implementation_complexity: high
    operational_complexity: high
    migration_risk: medium
    reversibility: moderate
    cost: high
    technical_maturity: stable
    lock_in: medium
    tradeoff_scores: {business_fit: -1, quality_fit: 1, team_fit: -2, implementation: -2, operations: -2, migration: -1, reversibility: 0, cost: -2, maturity: 1, lock_in: 0, evolution: 1}
    rejected_reasons:
      - It is unnecessary for new chains and unsafe for routine historical inspection.
  - id: enforce-github-settings
    title: Disable squash and rebase merging in repository settings
    complexity_tier: low
    architecture_styles: [style.plugin-architecture]
    patterns: []
    technologies: []
    benefits:
      - Prevents an incompatible merge choice in the GitHub UI.
    liabilities:
      - Mutates repository-wide collaboration policy outside this bounded change.
      - Does not replace portable ancestry validation.
    assumptions:
      - Administrators authorize a global merge-policy change.
    quality_attribute_effects:
      - {attribute: compatibility, effect: neutral, rationale: "The source contract is unchanged."}
      - {attribute: deterministic-enforcement, effect: improves, rationale: "The hosted UI prevents one ancestry-loss path."}
      - {attribute: traceability, effect: improves, rationale: "Reviewed commits are retained by policy."}
    business_fit: Useful only with explicit settings authorization.
    team_fit: Simple after maintainers agree on the policy.
    evolution_fit: Can be added without changing the portable validator.
    implementation_complexity: low
    operational_complexity: low
    migration_risk: medium
    reversibility: easy
    cost: low
    technical_maturity: mature
    lock_in: low
    tradeoff_scores: {business_fit: 0, quality_fit: 1, team_fit: 1, implementation: 2, operations: 2, migration: 0, reversibility: 2, cost: 2, maturity: 2, lock_in: 1, evolution: 1}
    rejected_reasons:
      - Code and publication authorization does not imply repository-settings authorization.
selected_option: keep-current
rationale: The selected option is the smallest compatible correction at the owning trust boundary. It preserves historical artifacts, requires current replay only when creating new trust, validates compact Context before consumption, and protects source anchors in portable CI and release checks.
revisit_triggers:
  - Signed attestations can verify archived outcomes without executing old code.
  - Maintainers authorize repository-wide merge-policy changes.
  - Downstream evidence shows current replay blocks a supported workflow.
acceptance_evidence:
  - The owner requested implementation and GitHub publication of the audit repairs.
  - The V2 Review resolves nine evidence records at cf254fa.
  - Ninety-five tests and all available local quality checks pass.
hard_eliminations: []
migration:
  affected_paths:
    - resources/scripts/architecture_tool.py
    - skills/project-architecture-audit/SKILL.md
    - skills/ai-agent-architecture-audit/SKILL.md
    - skills/mobile-architecture-audit/SKILL.md
    - skills/portfolio-architecture-audit/SKILL.md
    - skills/architecture-solution-advisor/references/decision-artifact-workflow.md
    - docs/migrating-to-0.4.2.md
    - .github/workflows/ci.yml
    - .github/workflows/release.yml
  slices:
    - Separate archived readability from current-runtime trust at new-chain entry points.
    - Validate compact Context before public Skill consumption.
    - Require source-anchor reachability and document Merge Commit integration.
  rollback: Revert enforcement compatibly while retaining readers and CLI flags; never rewrite historical artifacts or discard published source commits.
  validation:
    - Validate current and archived Selection paths, Context projections, Reviews, Decision bindings, and Git evidence.
    - Run tests, Ruff, repository and Knowledge validation, dependency and license audits, packaging, checksum, SBOM, and both Gates.
    - Require hosted CI before human V3 acceptance and Merge Commit integration.
