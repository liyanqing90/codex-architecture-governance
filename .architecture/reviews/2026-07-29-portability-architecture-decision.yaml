problem:
  quality_attributes:
    - maintainability
  constraints:
    - The eight public Skill identities and their workflow boundaries are compatibility contracts.
    - Runtime operation must remain local-first and require no hosted service, credentials, network, or telemetry.
    - Python 3.11 through 3.13 support and the current deterministic artifact contracts must be preserved.
    - The repository is maintained by a small open-source team with constrained operating budget.
  finding_ids: []
  assumptions:
    - The product remains an installable Codex plugin and local CLI for the next release horizon.
    - Repository-scale artifacts remain within normal local and CI resource budgets.
  known_facts:
    - The portability review assessed 31 rules, 6 critical flows, and 15 selected Knowledge entries without confirming an architecture risk.
    - Eight public Skills, versioned Knowledge and Rule Packs, strict schemas, and deterministic Python tooling already form distinct change boundaries.
    - Archived benchmark verification remains strict while CI and release now fetch the evidence-owning Git commits.
    - Portable path serialization and mixed-case manifest tests remove the observed Windows digest divergence.
    - The project Profile explicitly prohibits a required hosted runtime.
  unknowns:
    - The repaired GitHub-hosted matrix has not yet completed for the portability review commit.
    - External adoption and migration behavior after the v0.4.0 release are not yet observed.
    - The change frequency and ownership pressure that would justify stricter internal module enforcement are not yet measured.
    - A multi-user hosted governance service has no validated product demand or operating model.
