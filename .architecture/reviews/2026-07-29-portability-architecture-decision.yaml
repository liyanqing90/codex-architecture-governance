options:
  - id: keep-current
    title: Keep the local-first plugin architecture
    complexity_tier: keep-current
    architecture_styles: []
    patterns: []
    technologies: []
    benefits:
      - Preserves the verified workflow, knowledge, schema, and deterministic-tool boundaries.
      - Avoids migration and operating cost unsupported by a confirmed finding or measured demand.
    liabilities:
      - Continued growth still depends on maintainers preserving ownership boundaries through tests and review.
    assumptions:
      - The plugin and local CLI remain the product and deployment boundary.
    quality_attribute_effects:
      - attribute: maintainability
        effect: neutral
        rationale: Existing contracts permit independent evolution without adding a new runtime boundary.
    business_fit: Matches the current installable open-source product and constrained operating budget.
    team_fit: Uses the repository and Python capabilities already owned by the maintainers.
    evolution_fit: Keeps compatible internal extraction seams available when measured change pressure appears.
    implementation_complexity: low
    operational_complexity: low
    migration_risk: low
    reversibility: easy
    cost: low
    technical_maturity: mature
    lock_in: none
    tradeoff_scores:
      business_fit: 2
      quality_fit: 1
      team_fit: 2
      implementation: 2
      operations: 2
      migration: 2
      reversibility: 2
      cost: 2
      maturity: 2
      lock_in: 2
      evolution: 1
    rejected_reasons: []
  - id: internal-modules
    title: Enforce smaller internal modules and import boundaries
    complexity_tier: low
    architecture_styles:
      - style.modular-monolith
    patterns: []
    technologies:
      - technology.import-linter
    benefits:
      - Makes internal ownership and allowed dependency directions machine-checkable.
      - Creates clearer extraction seams without adding a distributed runtime.
    liabilities:
      - Requires a staged refactor, new configuration, and ongoing dependency-policy maintenance.
    assumptions:
      - Change coupling or contributor growth becomes measurable enough to justify enforcement.
    quality_attribute_effects:
      - attribute: maintainability
        effect: improves
        rationale: Explicit module contracts can reduce cross-owner changes once current boundaries create observed friction.
    business_fit: Remains compatible with one package and one release flow.
    team_fit: Requires manageable repository-level tooling but diverts time from product capabilities.
    evolution_fit: Provides the preferred next step if internal dependency pressure becomes material.
    implementation_complexity: medium
    operational_complexity: low
    migration_risk: medium
    reversibility: moderate
    cost: medium
    technical_maturity: mature
    lock_in: low
    tradeoff_scores:
      business_fit: 1
      quality_fit: 2
      team_fit: 1
      implementation: 0
      operations: 2
      migration: 0
      reversibility: 1
      cost: 1
      maturity: 2
      lock_in: 1
      evolution: 2
    rejected_reasons:
      - No verified finding or measured change-coupling threshold currently justifies the migration cost.
  - id: hosted-services
    title: Extract governance capabilities into hosted services
    complexity_tier: high
    architecture_styles:
      - style.microservices
    patterns: []
    technologies: []
    benefits:
      - Could centralize policy, execution, and organization-wide governance for a validated multi-user service.
      - Could scale selected workloads independently if hosted demand and operating ownership emerge.
    liabilities:
      - Adds network, identity, tenancy, availability, deployment, and on-call concerns absent from the current product.
      - Breaks the current full-offline operating constraint and increases cost and failure modes.
    assumptions:
      - A funded multi-user hosted product and an accountable operating team exist.
    quality_attribute_effects:
      - attribute: maintainability
        effect: degrades
        rationale: Distributed contracts and operations add coordination cost without current scale or ownership evidence.
    business_fit: Does not fit the current installable plugin product or constrained budget.
    team_fit: Requires service operations, identity, security, and on-call ownership not declared by the project.
    evolution_fit: Protects hypothetical hosted scale but constrains current local and offline evolution.
    implementation_complexity: high
    operational_complexity: high
    migration_risk: high
    reversibility: difficult
    cost: high
    technical_maturity: mature
    lock_in: medium
    tradeoff_scores:
      business_fit: -2
      quality_fit: -1
      team_fit: -2
      implementation: -2
      operations: -2
      migration: -2
      reversibility: -1
      cost: -2
      maturity: 2
      lock_in: 0
      evolution: -1
    rejected_reasons:
      - It violates the required local-first and no-hosted-runtime constraints.
      - No validated demand or accountable operating model offsets the distributed-system cost.
selected_option: keep-current
rationale: >-
  The verified review found no architecture risk requiring remediation and
  confirmed that the most release-critical evidence boundary now fails closed.
  Keeping the current local-first plugin structure therefore provides the best
  business, team, operational, migration, and reversibility fit. Internal
  modular enforcement remains a bounded next step when change-coupling evidence
  appears; hosted services are inconsistent with current constraints and lack
  product or ownership evidence.
revisit_triggers:
  - More than two independently owned modules repeatedly require coordinated changes across the same release boundary.
  - The deterministic CLI exceeds agreed CI budgets on representative downstream repositories.
  - A funded multi-user hosted product has named security, tenancy, availability, and on-call owners.
  - A verified review confirms boundary or dependency findings that cannot be corrected locally.
acceptance_evidence:
  - Architecture owner accepted the keep-current option for v0.4.0 after reviewing the verified artifact and explicit alternatives.
  - The selected option preserves every critical Profile constraint and requires no unverified architecture claim.
hard_eliminations:
  - option_id: hosted-services
    rule: The Profile prohibits a required hosted runtime and requires full offline operation.
    evidence:
      - .architecture/profile.yaml declares full offline operation and a prohibited required hosted runtime.
      - .architecture/constraints.md requires no network, credentials, telemetry, or external service for runtime behavior.
migration:
  affected_paths:
    - docs/migrating-to-0.4.md
    - resources/schemas/architecture-decision.schema.json
    - resources/schemas/architecture-design-brief.schema.json
    - resources/schemas/benchmark-observation.schema.json
    - resources/schemas/benchmark.schema.json
    - resources/schemas/gate-policy.schema.json
    - resources/schemas/knowledge-entry.schema.json
    - resources/schemas/knowledge-selection.schema.json
  slices:
    - Preserve the current eight-Skill public surface and local deterministic runtime for v0.4.0.
    - Monitor review findings, dependency direction, contributor ownership, and CI duration against the revisit triggers.
    - If a trigger is reached, pilot internal module boundaries before considering any deployment split.
  rollback: Remove only an optional future enforcement pilot and retain the current compatible plugin and CLI boundaries.
  validation:
    - Validate the accepted decision against the exact verified Review and selected Knowledge bytes.
    - Pass repository validation, tests, lint, formatting, architecture release gate, deterministic packaging, checksum, license audit, and SBOM generation.
