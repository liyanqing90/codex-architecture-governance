options:
- id: keep-current
  title: Keep the local-first plugin and adopt source-anchored Selection 1.4
  complexity_tier: keep-current
  architecture_styles:
  - style.plugin-architecture
  patterns: []
  technologies: []
  benefits:
  - Preserves the installable local runtime and public Skill boundaries.
  - Provides exact current replay and non-executing historical Git verification with
    fail-closed trusted semantics.
  - Separates project and plugin commits and removes irrelevant model context without
    weakening the exhaustive lock.
  liabilities:
  - Maintainers must publish an immutable source anchor before emitting trusted schema
    1.4 selections.
  - Historical verification after an upgrade needs a matching clone until release
    attestations gain a resolver.
  assumptions:
  - The local plugin and repository-scale CLI remain the product boundary.
  quality_attribute_effects:
  - attribute: compatibility
    effect: improves
    rationale: Legacy artifacts remain readable while new trusted chains gain an additive
      anchored contract.
  - attribute: deterministic-enforcement
    effect: improves
    rationale: Exact current bytes replay and mismatched runtimes must verify every
      recorded Git blob.
  - attribute: traceability
    effect: improves
    rationale: Project, plugin, implementation, Knowledge, policy, and result identities
      are explicit and separate.
  business_fit: Matches the installable open-source plugin and constrained operating
    model.
  team_fit: Uses the existing Python, schema, Knowledge, and regression-test ownership
    boundaries.
  evolution_fit: Uses additive schemas, a source locator, and a future release-attestation
    seam without creating a hosted runtime.
  implementation_complexity: low
  operational_complexity: low
  migration_risk: low
  reversibility: easy
  cost: low
  technical_maturity: mature
  lock_in: none
  tradeoff_scores:
    business_fit: 2
    quality_fit: 2
    team_fit: 2
    implementation: 2
    operations: 2
    migration: 2
    reversibility: 2
    cost: 2
    maturity: 2
    lock_in: 2
    evolution: 2
  rejected_reasons: []
- id: future-runtime-replay
  title: Accept self-declared mismatches as historical locks
  complexity_tier: low
  architecture_styles:
  - style.plugin-architecture
  patterns: []
  technologies: []
  benefits:
  - Uses no historical source resolver and preserves the smallest validator implementation.
  liabilities:
  - A caller can change implementation provenance and Knowledge maturity, recompute
    result_sha256, and bypass semantic validation.
  - The artifact cannot prove that the claimed Selector or Knowledge tree ever existed.
  assumptions:
  - Consumers accept retroactive reinterpretation of trusted evidence after every
    plugin upgrade.
  quality_attribute_effects:
  - attribute: compatibility
    effect: degrades
    rationale: A future implementation can reject an unchanged historical artifact.
  - attribute: deterministic-enforcement
    effect: degrades
    rationale: The same artifact can change result when unrelated current Knowledge
      changes.
  - attribute: traceability
    effect: degrades
    rationale: The creating Selector and policy are absent from the validation decision.
  business_fit: Conflicts with the published historical-evidence compatibility promise.
  team_fit: Appears simpler locally but transfers upgrade failures to maintainers
    and downstream consumers.
  evolution_fit: Couples all historical Reviews to every future Selector and Knowledge
    release.
  implementation_complexity: low
  operational_complexity: medium
  migration_risk: high
  reversibility: moderate
  cost: medium
  technical_maturity: stable
  lock_in: high
  tradeoff_scores:
    business_fit: -2
    quality_fit: -2
    team_fit: -1
    implementation: 2
    operations: -1
    migration: -2
    reversibility: 0
    cost: 0
    maturity: 1
    lock_in: -2
    evolution: -2
  rejected_reasons:
  - It reproduces the verified trust-boundary defect and cannot enter a deterministic
    Gate.
- id: mandatory-git-bound-replay
  title: Always execute the recorded historical Selector
  complexity_tier: medium
  architecture_styles:
  - style.plugin-architecture
  patterns: []
  technologies: []
  benefits:
  - Can reproduce the old algorithm when source, dependencies, and environment remain
    available.
  liabilities:
  - Executes old and potentially untrusted code during routine validation.
  - Requires dependency restoration, isolation, platform reconstruction, and a substantially
    larger security boundary.
  assumptions:
  - All repositories preserve source objects and reproducible dependency environments
    indefinitely.
  quality_attribute_effects:
  - attribute: compatibility
    effect: improves
    rationale: A reachable archive can reproduce the creating runtime exactly.
  - attribute: deterministic-enforcement
    effect: improves
    rationale: Replay uses the recorded implementation when its environment is reconstructible.
  - attribute: traceability
    effect: improves
    rationale: The result can be tied to a complete historical source tree.
  business_fit: Suitable as an optional V4/V5 archival check, not the default local
    validation path.
  team_fit: Requires isolation and reproducible-environment ownership beyond the routine
    plugin workflow.
  evolution_fit: Adds a high-assurance path but makes ordinary validation depend on
    indefinite Git and dependency retention.
  implementation_complexity: high
  operational_complexity: high
  migration_risk: medium
  reversibility: moderate
  cost: high
  technical_maturity: stable
  lock_in: medium
  tradeoff_scores:
    business_fit: 0
    quality_fit: 2
    team_fit: -1
    implementation: -2
    operations: -2
    migration: -1
    reversibility: 0
    cost: -2
    maturity: 1
    lock_in: 0
    evolution: 1
  rejected_reasons:
  - Hashing anchored historical blobs proves the creation-time inputs needed by the
    lock without executing old code.
  - Executable reconstruction remains disproportionate for routine trusted validation.
selected_option: keep-current
rationale: The selected option fixes provenance at the Selection boundary with the
  smallest compatible contract. Current artifacts still replay exactly. A runtime
  mismatch must resolve the recorded plugin repository and commit, verify the fixed
  transitive input set, plugin identity, complete Knowledge tree, and selected metadata,
  and never execute historical code. Unresolvable locks remain readable only in explicit
  read-only mode and cannot enter a new trusted chain. The selected-only context sidecar
  removes prompt pollution while the full machine lock remains authoritative.
revisit_triggers:
- A signed release attestation format can verify packaged historical runtime bytes
  without a Git clone.
- A verified Selector dependency is missing from the contract 1.1 exact implementation
  input set.
- Downstream migration evidence shows schema 1.4 cannot preserve a supported historical
  workflow.
- Production-selected A/B/C model runs show the compact sidecar harms decision quality
  or fails to reduce context.
acceptance_evidence:
- The repository owner authorized implementation and GitHub publication of the audit
  repairs.
- The verified Review resolves all thirteen Git evidence records and confirms the negative
  tamper and archived-runtime regressions.
- The implementation source tree is reachable on GitHub and exactly matches the locally
  validated tree SHA.
hard_eliminations: []
migration:
  affected_paths:
  - docs/migrating-to-0.4.2.md
  - resources/schemas/knowledge-context.schema.json
  - resources/schemas/knowledge-selection.schema.json
  - resources/schemas/selector-source.schema.json
  slices:
  - Publish the exact implementation tree and record its reachable plugin source commit.
  - Emit schema 1.4 locks with separate project/plugin commits and the full Runtime
    Input Manifest.
  - Require current replay or anchored historical Git verification for trusted consumers;
    preserve explicit read-only legacy inspection.
  - Generate compact selected-only context sidecars and keep exhaustive exclusions
    in the machine lock.
  - Shrink the dogfood Profile to the two product domains supported by declared evidence.
  rollback: Revert new generation in a compatible follow-up while retaining schema
    1.4 readers and every published source anchor; never rewrite historical locks,
    Reviews, or commits.
  validation:
  - Validate active and frozen Facts, Profiles, Selection 1.4 locks, compact context
    projections, candidate/verified Review bindings, Git evidence, and this Decision.
  - Run negative provenance tampering and positive archived-runtime tests, the full
    suite, Ruff, repository and Knowledge validation, dependency/license audits, deterministic
    packaging, checksum, and SPDX generation.
  - Run change and release Gates, then require the GitHub matrix and Dependency Review
    to complete successfully.
