problem:
  quality_attributes:
  - compatibility
  - deterministic-enforcement
  - traceability
  constraints:
  - The installable local plugin and eight public Skill identities remain compatibility
    contracts.
  - Historical Selector code must never execute during ordinary archived-lock validation.
  - Trusted Reviews, Decisions, and Gates must fail closed when a runtime source cannot
    be verified.
  - Schema 1.0 through 1.3 artifacts remain readable and are never rewritten to manufacture
    provenance.
  - The project remains offline-capable and adds no required hosted service, credential,
    or telemetry path.
  finding_ids: []
  assumptions:
  - Git source commits remain the durable 0.4.2 provenance anchor; a release-attestation
    resolver can be additive later.
  - Repository-scale Git blob verification remains within normal local and CI budgets.
  - The selected-only context sidecar is model input while the complete lock remains
    machine governance input.
  known_facts:
  - The verified Review confirms four strengths, thirteen resolved Git evidence records,
    31 rules, six critical flows, and ten selected audit Knowledge entries.
  - Selector contract 1.1 binds eleven exact implementation inputs, plugin identity,
    dependency lock, and the raw Knowledge tree.
  - Selection schema 1.4 separates inputs.project_commit from selector.source.commit.
  - Trusted provenance mismatch either verifies anchored historical Git blobs or fails;
    read-only inspection is explicit.
  - The active Profile now requires only plugin-platform and test-automation-platform.
  - Compact Knowledge context sidecars omit all excluded entries and bind the complete
    lock by SHA-256.
  unknowns:
  - External-model production-selected A/B/C quality, token, cost, and tool-call outcomes
    remain unmeasured.
  - Packaged installs without a matching Git clone need a future release-attestation
    resolver after runtime upgrades.
  - Downstream schema 1.4 adoption evidence will accumulate only after publication.
