- id: plugin-discovery-and-skill-execution
  status: assessed
  reason: Manifest, Skill context projection, selected Knowledge, and package inventory
    were traced at the reviewed commit.
- id: finding-verification-and-policy-enforcement
  status: assessed
  reason: Current replay, archived Git verification, unverifiable rejection, Review
    bindings, and Gate entry paths were traced and tested.
- id: architecture-knowledge-and-behavior-evaluation
  status: assessed
  reason: Profile routing, exhaustive locks, compact context projection, benchmark
    limitations, and negative tamper cases were traced.
- id: greenfield-architecture-decision
  status: assessed
  reason: Decision-specific schema 1.4 selections and additive Decision schema compatibility
    were validated.
- id: safe-project-initialization
  status: assessed
  reason: Initialization and refusal-to-overwrite behavior remain covered by the complete
    regression suite.
- id: deterministic-release-packaging
  status: assessed
  reason: Source anchor metadata, runtime allowlist, checksum, license, and SPDX paths
    were validated locally.
