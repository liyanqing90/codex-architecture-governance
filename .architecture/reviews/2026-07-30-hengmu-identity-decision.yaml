options:
  - id: keep-current
    title: Keep the implemented unified Hengmu identity
    complexity_tier: keep-current
    architecture_styles:
      - style.plugin-architecture
    patterns: []
    technologies: []
    benefits:
      - Presents one public name across discovery, installation, documentation, release assets, and provenance.
      - Preserves historical evidence through narrow aliases instead of byte rewriting.
      - Keeps the local plugin architecture and its offline operating model unchanged.
    liabilities:
      - Frozen historical artifacts continue to contain the former identity.
      - The GitHub rename and post-rename verification are explicit external steps.
    assumptions:
      - The owner-provided no-user constraint remains accurate until publication.
    quality_attribute_effects:
      - {attribute: compatibility, effect: improves, rationale: "New surfaces agree while frozen evidence remains readable through explicit aliases."}
      - {attribute: maintainability, effect: improves, rationale: "One manifest-owned public identity removes duplicated naming rules."}
      - {attribute: traceability, effect: improves, rationale: "Historical bytes and Git commits remain intact while new provenance names Hengmu."}
    business_fit: Establishes a coherent open-source identity before external adoption.
    team_fit: Uses the existing manifest, validators, tests, release workflow, and GitHub repository.
    evolution_fit: Future versions extend one public contract while old evidence remains archived.
    implementation_complexity: low
    operational_complexity: low
    migration_risk: low
    reversibility: easy
    cost: low
    technical_maturity: mature
    lock_in: low
    tradeoff_scores: {business_fit: 2, quality_fit: 2, team_fit: 2, implementation: 2, operations: 2, migration: 2, reversibility: 2, cost: 2, maturity: 2, lock_in: 1, evolution: 2}
    rejected_reasons: []
  - id: preserve-split-identity
    title: Keep the former machine identity behind the Hengmu display brand
    complexity_tier: low
    architecture_styles:
      - style.plugin-architecture
    patterns: []
    technologies: []
    benefits:
      - Avoids changing repository, plugin, and archive identifiers.
      - Requires no historical alias handling.
    liabilities:
      - Keeps installation, badges, package provenance, and brand presentation inconsistent.
      - Creates a permanent compatibility promise for an identity with no external users.
    assumptions:
      - A split identity is less costly than a pre-adoption reset.
    quality_attribute_effects:
      - {attribute: compatibility, effect: neutral, rationale: "It preserves an unused identifier but adds no consumer protection."}
      - {attribute: maintainability, effect: degrades, rationale: "Every public surface must continue mapping two names indefinitely."}
      - {attribute: traceability, effect: degrades, rationale: "Display and machine provenance describe different identities."}
    business_fit: Weakens discoverability and a coherent Qingye open-source portfolio.
    team_fit: Avoids one rename but preserves recurring naming work.
    evolution_fit: Every future release must document the split identity.
    implementation_complexity: low
    operational_complexity: medium
    migration_risk: low
    reversibility: easy
    cost: medium
    technical_maturity: mature
    lock_in: medium
    tradeoff_scores: {business_fit: -1, quality_fit: -1, team_fit: 0, implementation: 2, operations: -1, migration: 2, reversibility: 2, cost: 0, maturity: 2, lock_in: -1, evolution: -1}
    rejected_reasons:
      - There are no users whose compatibility needs justify the ongoing split.
  - id: rewrite-history
    title: Rewrite every historical artifact and Git commit to Hengmu
    complexity_tier: high
    architecture_styles:
      - style.plugin-architecture
    patterns: []
    technologies: []
    benefits:
      - Removes the former text from all reachable repository bytes.
      - Produces superficially uniform search results.
    liabilities:
      - Invalidates hashes, signatures, source commits, decisions, and review provenance.
      - Requires force-push and breaks every existing commit reference.
    assumptions:
      - Visual uniformity is more valuable than truthful evidence history.
    quality_attribute_effects:
      - {attribute: compatibility, effect: degrades, rationale: "Historical hashes and commit references no longer resolve."}
      - {attribute: maintainability, effect: degrades, rationale: "Reconstructed governance chains require extensive manual rewriting."}
      - {attribute: traceability, effect: degrades, rationale: "The repository would no longer preserve what was actually reviewed."}
    business_fit: Adds destructive migration risk without user value.
    team_fit: Requires repository-wide history reconstruction and force-push coordination.
    evolution_fit: Establishes a precedent of rewriting evidence when branding changes.
    implementation_complexity: high
    operational_complexity: high
    migration_risk: critical
    reversibility: difficult
    cost: high
    technical_maturity: stable
    lock_in: high
    tradeoff_scores: {business_fit: -2, quality_fit: -2, team_fit: -2, implementation: -2, operations: -2, migration: -2, reversibility: -2, cost: -2, maturity: 0, lock_in: -2, evolution: -2}
    rejected_reasons:
      - It falsifies provenance and introduces destructive history rewriting.
selected_option: keep-current
rationale: The implemented reset is the smallest coherent option because it establishes one public identity before adoption, derives new artifacts from the manifest, and limits compatibility code to exact aliases for immutable evidence. Preserving a split identity adds permanent maintenance with no user benefit, while rewriting history destroys the traceability this project exists to enforce.
revisit_triggers:
  - A package registry introduces an immutable external package identity that differs from the GitHub repository.
  - GitHub stops redirecting renamed repositories.
  - A documented retention policy retires all pre-rename governance evidence.
acceptance_evidence:
  - The owner explicitly authorized a complete identity reset and confirmed there are no historical users.
  - The current verified Review reports complete rule and critical-flow coverage with no unresolved Finding.
  - Deterministic project, repository, Context, Review, and coverage validation passed for the reviewed implementation.
hard_eliminations:
  - option_id: rewrite-history
    rule: Do not destroy immutable evidence or rewrite Git history for a branding change.
    evidence:
      - Existing Reviews, Decisions, and Selector locks bind hashes and Git commits that must remain resolvable.
migration:
  affected_paths:
    - .codex-plugin/plugin.json
    - .architecture/profile.yaml
    - .architecture/gate-policy.yaml
    - README.md
    - README.zh-CN.md
    - resources/selector-source.json
    - resources/scripts/architecture_tool.py
    - resources/templates/knowledge-selection.yaml
    - resources/templates/github-architecture-gate.yml
    - scripts/generate_sbom.py
    - .github/workflows/release.yml
  slices:
    - Align manifest, documentation, active governance configuration, templates, release names, and SBOM provenance on Hengmu.
    - Preserve pre-rename validation through exact repository URL and project identity aliases.
    - Push the reviewed branch, rename the GitHub repository, update local origin, and verify redirects and hosted checks.
  rollback: Before a Hengmu release, rename GitHub back and revert the additive identity-reset commits; never rewrite historical evidence or force-push.
  validation:
    - Validate repository, project, history anchors, Context, Review, coverage, and accepted Decision.
    - Run the complete test suite, Ruff, dependency and license audits, deterministic packaging, checksum, and SBOM checks.
    - Verify the new GitHub repository URL, old URL redirect, branch SHA, local origin, and hosted CI.
