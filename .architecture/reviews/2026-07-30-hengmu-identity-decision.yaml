problem:
  quality_attributes:
    - compatibility
    - maintainability
    - traceability
  constraints:
    - The owner confirms that no historical users or installations require the former public machine identity.
    - New repository, plugin, archive, SBOM, CI marker, and documentation surfaces use Hengmu.
    - Hash-bound pre-rename governance artifacts and Git ancestry are not rewritten.
    - The GitHub repository rename remains reversible until a Hengmu release creates external consumers.
  finding_ids: []
  assumptions:
    - GitHub retains normal redirects from the former repository slug after rename.
    - The authorized branch can be pushed before the repository is renamed.
  known_facts:
    - The verified Review covers all 31 applicable rules and all six critical flows with no unresolved Finding.
    - The plugin manifest owns the Hengmu package name and repository URL.
    - Package and SBOM generation derive new artifact identity from the plugin manifest.
    - Explicit repository URL and project identity aliases preserve validation of frozen pre-rename evidence.
  unknowns:
    - Hosted CI and redirect behavior cannot be observed until the external push and repository rename complete.
