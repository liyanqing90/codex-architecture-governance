summary:
  architecture: Hengmu keeps its installable local plugin runtime and its public static website as separate delivery surfaces. A pinned GitHub Actions workflow assembles an explicit Pages artifact from repository-owned HTML, locale data, styles, scripts, and brand assets without changing the plugin package allowlist.
