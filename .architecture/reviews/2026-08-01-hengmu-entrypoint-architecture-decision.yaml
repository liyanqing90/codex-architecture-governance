problem:
  quality_attributes:
    - compatibility
    - maintainability
    - traceability
  constraints:
    - Users need one memorable Hengmu entry and must not need to recall eight workflow names.
    - Audit, verification, decision, planning, and gate authority remain separate.
    - All eight focused Skill names remain directly invocable compatibility contracts.
    - Menu-only invocation cannot create project state or begin a workflow.
    - The plugin remains local-first and adds no hosted service, MCP server, credentials, or telemetry.
  finding_ids: []
  assumptions:
    - The Codex Skill surface continues to discover direct child directories under the manifest `skills` root.
    - Natural-language routing remains adequate when the entry description and focused handoff rules are present.
  known_facts:
    - The verified Review covers all 31 rules and six critical flows with no unresolved Finding.
    - The entry maps every supported intent to one existing `SKILL.md` and contains no schema, policy, or artifact implementation.
    - Repository validation requires nine public Skills and 45 boundary cases.
    - Contract tests prove complete route coverage and direct focused-invocation bypass.
  unknowns:
    - Installed-surface routing quality varies by Codex and model version and needs a time-bound forward test before release.
