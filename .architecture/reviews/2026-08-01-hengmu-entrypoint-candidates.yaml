summary:
  architecture: The additive `hengmu` Skill is a discovery-only routing facade over eight unchanged focused workflow Skills. It accepts a compact command or natural-language goal, shows a non-mutating menu when no task is supplied, reads exactly one focused Skill before work, and leaves artifact authority with that focused workflow. Repository validation, UI metadata, bilingual documentation, the public website, evaluation coverage, and compatibility tests make the new entry visible and keep the original names directly invocable.
