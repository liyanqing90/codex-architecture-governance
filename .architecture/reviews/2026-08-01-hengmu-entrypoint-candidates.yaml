critical_flow_coverage:
  - id: plugin-discovery-and-skill-execution
    status: assessed
    reason: The plugin manifest discovers the new direct child Skill; the router maps every command to one existing Skill, forbids menu-time state creation, and preserves direct focused invocation.
  - id: finding-verification-and-policy-enforcement
    status: assessed
    reason: The router explicitly preserves candidate, verifier, decision, planner, and gate authority transitions and cannot bypass a focused Skill stop condition.
  - id: architecture-knowledge-and-behavior-evaluation
    status: assessed
    reason: The public Skill set expands from eight to nine and the routing corpus expands from 40 to 45 with one direct, indirect, incomplete, negative, and edge case for the new entry.
  - id: greenfield-architecture-decision
    status: assessed
    reason: Natural-language solution requests route to the existing Solution Advisor; Design Brief, comparison, and acceptance contracts remain unchanged.
  - id: safe-project-initialization
    status: assessed
    reason: Menu-only invocation forbids project initialization; routed audits retain the existing idempotent preparation workflow.
  - id: deterministic-release-packaging
    status: assessed
    reason: The package allowlist already includes the complete skills tree; repository, official Skill, plugin, dependency, license, and deterministic archive checks cover the additive entry.
unknowns:
  - Installed-surface natural-language routing quality remains time-bound to the Codex version and requires a post-install forward test before release.
