summary:
  architecture: Independent inspection confirms that `hengmu` is a thin, non-authoritative routing facade. Each route names one existing Skill and requires that Skill to be read completely before it owns the task. Empty invocation is explicitly non-mutating, natural-language routing does not change lifecycle policy, and direct focused invocation bypasses the router. Static validation, 45 boundary cases, contract tests, bilingual documentation, and the website expose the entry without altering artifact schemas or deterministic runtime behavior.
  raw_findings: 0
  confirmed: 0
  rejected: 0
  needs_evidence: 0
