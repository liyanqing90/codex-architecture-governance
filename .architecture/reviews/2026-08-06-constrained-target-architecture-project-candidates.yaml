summary:
  architecture: Hengmu 1.0.0 keeps one public router and eight focused Skills, extending the existing Solution Advisor rather than adding a competing architecture-selection workflow. The reviewed commit adds typed open or constrained Design Brief 1.1, target Architecture Decision 1.4, Greenfield Plan 1.3, SSH-bound approval, evidence-bound rule and critical-flow coverage, isolated Evidence Provider execution, migration compatibility, and deterministic packaging. Static contracts, negative trust-boundary tests, a real signed Greenfield chain, and release tooling cover the new path.
  raw_findings: 0
  confirmed: 0
  rejected: 0
  needs_evidence: 0
