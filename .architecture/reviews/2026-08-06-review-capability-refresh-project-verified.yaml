  - id: HGM-TRACE-001
    fingerprint: f9fbbb8bda90cb665b25b8d3815c020e5cfa51d55942e2ee81dfa8e42722f6c1
    kind: risk
    rule_id: PROJECT.CONTRACT.001
    title: Trusted Review paths do not enforce one reviewed source snapshot
    invariant: A verified Review, its source candidate, and current-source evidence must be bound to the same reviewed repository snapshot unless evidence is explicitly classified as historical.
    severity: high
    confidence: 0.94
    verification:
      status: confirmed
      rationale: >-
        在固定提交直接重读 Review 校验与证据解析边界：verified Review 只校验 source_candidate 的路径、ID、文件哈希和 Finding 语义；source evidence 解析只接受证据自带的 Git commit。
        最强反假设是诚实 verifier 会重新阅读当前源码，且候选/证据本次确实都指向固定提交；这不能替代 validator 对 verified review.commit 与 candidate.review.commit 的一致性约束，因此该信任边界缺口成立。
      verified_by: architecture-verifier
      verified_at: "2026-08-06T12:43:00Z"
