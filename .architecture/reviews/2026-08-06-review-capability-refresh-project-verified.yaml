        symbol: verify_review_evidence
        observation: Gate evidence resolution validates Finding evidence but coverage without Findings supplies no path-level evidence for this step to resolve.
    impact:
      affected_components:
        - Review coverage contract
        - independent verification handoff
        - deterministic Gate
      failure_mode: A verified Review with zero Findings can mark every Rule and critical flow assessed, set coverage_complete true, and pass structural coverage checks without binding what was inspected for the no-Finding conclusions.
      blast_radius: Trusted Reviews whose assessed Rules or critical flows produce no Finding, especially broad scope manifests such as the repository root.
    counter_evidence:
      - Role separation, source-candidate hashing, complete Rule enumeration, critical-flow reasons, human reports, and verifier procedure all provide process controls.
      - A no-Finding assessment cannot always cite one decisive source, and deterministic tooling cannot prove that a model actually read evidence.
