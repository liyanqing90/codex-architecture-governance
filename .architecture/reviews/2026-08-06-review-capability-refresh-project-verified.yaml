critical_flow_coverage:
  - id: plugin-discovery-and-skill-execution
    status: assessed
    reason: The thin hengmu router preserves focused Skill authority, and repository validation plus routing cases protect direct and indirect activation without adding runtime authority.
  - id: finding-verification-and-policy-enforcement
    status: assessed
    reason: Candidate, verifier, evidence, policy, and Gate paths were traced; HGM-TRACE-001, HGM-PROVIDER-001, HGM-PROVIDER-002, and HGM-COVERAGE-001 record the surviving trust-boundary candidates.
  - id: architecture-knowledge-and-behavior-evaluation
    status: assessed
    reason: Selection, compact context, cache invalidation, AI-agent rules, evaluation contracts, and 129 tests were inspected; runtime model telemetry remains an explicit target-system limitation.
  - id: greenfield-architecture-decision
    status: assessed
    reason: Design Brief authority remains separate, while HGM-EVOLUTION-001 records the unresolved relationship between adoption thresholds and pilot observations.
  - id: safe-project-initialization
    status: assessed
    reason: Existing-state validation and overwrite refusal remain unchanged; generated per-run audit inputs use non-overwriting paths.
  - id: deterministic-release-packaging
    status: assessed
    reason: Runtime allowlisting, dependency and license checks, deterministic archives, checksums, and SBOM paths were inspected; Provider reproducibility remains separately captured in HGM-PROVIDER-002.
unknowns:
  - Current Codex model surfaces do not expose stable per-stage token and prompt-cache telemetry to this local plugin, so observed savings and cache hit rates remain unmeasured.
  - External quality-provider dependency closure varies by ecosystem and project configuration; this audit did not assert one universal pinning mechanism.
