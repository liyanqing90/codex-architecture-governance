summary:
  architecture: Hengmu remains a local, distributable architecture-governance plugin. Public Skills own distinct audit, verification, decision, planning, and Gate authorities; shared Python tooling validates versioned YAML/JSON contracts, selects source-bound Knowledge, executes explicitly configured Evidence Providers without a shell, and evaluates verified artifacts deterministically. The current change deepens AI-agent review guidance, adds compact context projection and content-bound caches, introduces cross-language optional quality providers and technology-evolution decisions, and derives repeat-review impact from Git and policy. The plugin intentionally does not become a hosted agent runtime, universal scanner, package manager, or autonomous upgrader.
  raw_findings: 5
  confirmed: 4
  rejected: 0
  needs_evidence: 1
