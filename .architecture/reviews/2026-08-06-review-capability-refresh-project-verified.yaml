limitations:
  - Hengmu defines how an AI-agent system must be audited but is not itself a model host or agent runtime; real prompt assembly, token usage, provider cache hits, privacy flow, and model behavior require target-system or model-surface evidence.
  - The compact Knowledge Context proves ordered, source-bound disclosure metadata; it does not claim observed token savings or prompt-cache improvement without Full versus Compressed benchmark evidence from the active model surface.
  - Optional cross-language Providers remain disabled until a project reviews and enables an exact command; this audit did not run every external ecosystem tool.
