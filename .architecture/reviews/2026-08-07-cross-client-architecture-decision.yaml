options:
- id: keep-current
  title: Keep the local-first plugin architecture
  complexity_tier: keep-current
  architecture_styles: []
  patterns: []
  technologies: []
  benefits:
  - Preserves the verified workflow, knowledge, schema, and deterministic-tool boundaries.
  - Avoids migration and operating cost unsupported by a confirmed finding or measured
    demand.
  liabilities:
  - Continued growth still depends on maintainers preserving ownership boundaries
    through tests and review.
  assumptions:
  - The plugin and local CLI remain the product and deployment boundary.
  quality_attribute_effects:
  - attribute: compatibility
    effect: neutral
    rationale: Preserves the native package and public Skill contract while adding
      only an explicit projection.
  - attribute: deterministic-enforcement
    effect: improves
    rationale: Keeps validation and packaging under the existing deterministic local
      toolchain.
  - attribute: safety
    effect: improves
    rationale: Retains local fail-closed provider and evidence controls.
  - attribute: traceability
    effect: improves
    rationale: Binds docs, archives, checksums, SBOMs, and workflow comparisons to
      explicit source evidence.
  business_fit: Matches the current installable open-source product and constrained
