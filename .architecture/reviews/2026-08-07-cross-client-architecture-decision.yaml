problem:
  quality_attributes:
  - compatibility
  - deterministic-enforcement
  - safety
  - traceability
  constraints:
  - The native Codex manifest, public Skill identities, and local CLI remain authoritative
    compatibility contracts.
  - The Agent Plugins archive is an additive portable projection and must not imply
    unverified host-specific activation.
  - Evidence Provider validation must remain offline, bounded, and fail closed across
    POSIX and Windows executable spellings.
  - CI and release workflows must bind package, checksum, SBOM, and attestation behavior
    to immutable source and explicit comparison boundaries.
  - Documentation and repository metadata must describe observed capabilities and
    invite real user feedback without fabricated adoption claims.
  finding_ids: []
  assumptions:
  - Hengmu remains an installable local Codex plugin and local Python CLI rather than
    a hosted runtime.
  - Downstream host activation is validated through explicit host-specific evidence
    and user feedback rather than inferred from archive shape.
  known_facts:
  - The independent verified Review for a2c0679 found no unresolved architecture Finding.
  - The repository already declares native Codex contracts, portable Agent Plugins
    packaging, full offline operation, and three required project Rule Packs.
  - The final code has focused regression coverage for UTF-8 Git evidence, Windows
    executable normalization, absolute Python paths, and portable metadata.
  unknowns:
  - No Hengmu-specific Cursor installation smoke test has been observed.
  - GitHub-hosted release attestations and downstream adoption remain external evidence
    until their workflows run and users report results.
