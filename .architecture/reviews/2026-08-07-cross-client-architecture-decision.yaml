- id: hosted-services
  title: Extract governance capabilities into hosted services
  complexity_tier: high
  architecture_styles:
  - style.microservices
  patterns: []
  technologies: []
  benefits:
  - Could centralize policy, execution, and organization-wide governance for a validated
    multi-user service.
  - Could scale selected workloads independently if hosted demand and operating ownership
    emerge.
  liabilities:
  - Adds network, identity, tenancy, availability, deployment, and on-call concerns
    absent from the current product.
  - Breaks the current full-offline operating constraint and increases cost and failure
    modes.
  assumptions:
  - A funded multi-user hosted product and an accountable operating team exist.
  quality_attribute_effects:
  - attribute: compatibility
    effect: degrades
    rationale: Introduces an additional contract boundary that requires migration
      evidence.
  - attribute: deterministic-enforcement
    effect: degrades
    rationale: Adds remote execution and provenance dependencies outside the current
      deterministic boundary.
  - attribute: safety
    effect: degrades
    rationale: Expands identity, network, and operational attack surfaces without
      current ownership evidence.
  - attribute: traceability
    effect: degrades
    rationale: Requires additional cross-boundary evidence and ownership to preserve
      traceability.
  business_fit: Does not fit the current installable plugin product or constrained
    budget.
  team_fit: Requires service operations, identity, security, and on-call ownership
    not declared by the project.
  evolution_fit: Protects hypothetical hosted scale but constrains current local and
    offline evolution.
  implementation_complexity: high
  operational_complexity: high
  migration_risk: high
  reversibility: difficult
  cost: high
  technical_maturity: mature
  lock_in: medium
  tradeoff_scores:
    business_fit: -2
    quality_fit: -1
    team_fit: -2
    implementation: -2
    operations: -2
    migration: -2
    reversibility: -1
    cost: -2
    maturity: 2
    lock_in: 0
    evolution: -1
  rejected_reasons:
  - It violates the required local-first and no-hosted-runtime constraints.
  - No validated demand or accountable operating model offsets the distributed-system
    cost.
selected_option: keep-current
rationale: The verified review found no architecture risk requiring a new runtime
  boundary. Keep the local-first native Codex architecture and add a deterministic
  Agent Plugins projection, explicit CI/release evidence, and truthful cross-client
  documentation. This preserves compatibility and rollback while making portability
  discoverable without claiming host activation that has not been observed.
revisit_triggers:
- A downstream host installation report identifies a reproducible package or Skill
  activation incompatibility.
- A verified finding shows that the portable projection weakens source, evidence,
  or release provenance.
- The project adopts a hosted runtime or a host-specific adapter requiring new identity,
  network, or operational ownership.
- Measured contributor or change coupling justifies an internal module-boundary decision
  beyond the additive package projection.
acceptance_evidence:
- The repository architecture-owner role accepts this bounded additive package, CI,
  release, and documentation scope while retaining the native Codex runtime as authoritative.
- The independent verified Review is bound to a2c0679 and reports no unresolved Finding;
  downstream host activation remains an explicit unknown rather than an inferred success.
hard_eliminations:
- option_id: hosted-services
  rule: The Profile requires full offline operation and prohibits a required hosted
    runtime.
  evidence:
  - .architecture/profile.yaml declares full offline operation and a prohibited required
    hosted runtime.
  - .architecture/constraints.md requires no network, credentials, telemetry, or external
    service for runtime behavior.
migration:
  affected_paths:
  - .github/workflows/ci.yml
  - .github/workflows/release.yml
  - docs/compatibility.md
  - README.md
  - README.zh-CN.md
  - scripts/package_plugin.py
  - scripts/generate_sbom.py
  - resources/scripts/architecture_tool.py
  slices:
  - Keep .codex-plugin/plugin.json and native Codex packaging unchanged while emitting
    a validated Agent Plugins projection.
  - Run the six-platform CI matrix and deterministic package/SBOM checks before treating
    portable support as released.
  - Collect real downstream host feedback and add host-specific smoke evidence before
    making stronger compatibility claims.
  rollback: Remove the additive Agent Plugins archive and documentation projection
    while retaining the native Codex archive, source-bound governance chain, and fail-closed
    provider fixes.
  validation:
  - Validate the candidate and verified Review against the exact a2c0679 evidence
    commit and selected Knowledge bytes.
  - Pass repository validation, tests, lint, formatting, architecture change Gate,
    both deterministic package builds, checksums, license audit, and per-archive SBOM
    generation.
  - Record downstream host installation results as explicit user or release evidence
    before expanding the compatibility matrix.
