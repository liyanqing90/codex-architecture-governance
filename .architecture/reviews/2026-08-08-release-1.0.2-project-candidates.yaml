summary:
  architecture: Hengmu 1.0.2 remains a local, distributable architecture-governance
    plugin with one Skills and deterministic tooling core, projected into native Codex
    and portable Agent Plugins archives. This full review assesses the current cross-IDE
    installation contract, portable package runtime, smoke verification, version binding,
    deterministic packaging, SBOM generation, and release attestation path without claiming
    host lifecycle or permission-hook equivalence.
  raw_findings: 0
  confirmed: 0
  rejected: 0
  needs_evidence: 0
