name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked development dependencies
        run: >-
          python -m pip install --require-hashes
          --requirement requirements-dev.lock

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Validate dogfood architecture profile
        run: python resources/scripts/architecture_tool.py validate-project .

      - name: Validate architecture knowledge
        run: python resources/scripts/validate_knowledge.py

      - name: Run tests
        run: python -m pytest

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Audit runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pip_audit --requirement requirements-runtime.lock

      - name: Audit runtime dependency licenses
        run: python scripts/audit_licenses.py

      - name: Build deterministic plugin archive
        run: python scripts/package_plugin.py --output-dir dist

      - name: Verify archive checksum
        shell: bash
        run: python scripts/verify_checksum.py dist/*.zip.sha256

      - name: Generate SPDX SBOM
        shell: bash
        run: >-
          python scripts/generate_sbom.py
          --archive dist/*.zip
          --output dist/plugin.spdx.json

  dependency-review:
    name: Dependency and license review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          deny-licenses: GPL-3.0, AGPL-3.0
