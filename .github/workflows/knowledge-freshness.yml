name: Architecture knowledge freshness

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked runtime
        run: >-
          python -m pip install --require-hashes
          --requirement requirements-runtime.lock

      - name: Validate knowledge freshness
        id: freshness
        continue-on-error: true
        shell: bash
        run: |
          python resources/scripts/architecture_tool.py validate-knowledge \
            2>&1 | tee knowledge-freshness.txt

      - name: Open or update freshness issue
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          title="Architecture knowledge requires freshness review"
          issue_number="$(
            gh issue list \
              --repo "${REPOSITORY}" \
              --state open \
              --search "${title} in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          {
            echo "Scheduled knowledge validation failed."
            echo
            echo '```text'
            sed -n '1,200p' knowledge-freshness.txt
            echo '```'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > knowledge-issue.md
          if [[ -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" \
              --repo "${REPOSITORY}" \
              --body-file knowledge-issue.md
          else
            gh issue create \
              --repo "${REPOSITORY}" \
              --title "${title}" \
              --body-file knowledge-issue.md
          fi

      - name: Enforce freshness result
        if: steps.freshness.outcome == 'failure'
        run: exit 1
