name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "site/**"
      - "assets/hengmu-readme-illustrations/**"
      - "docs/assets/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            _site/site \
            _site/assets/hengmu-readme-illustrations/en \
            _site/assets/hengmu-readme-illustrations/zh-CN \
            _site/docs/assets/brand/en \
            _site/docs/assets/brand/zh-CN
          cp index.html robots.txt sitemap.xml _site/
          cp -R site/. _site/site/
          cp assets/hengmu-readme-illustrations/en/*.png \
            _site/assets/hengmu-readme-illustrations/en/
          cp assets/hengmu-readme-illustrations/zh-CN/*.png \
            _site/assets/hengmu-readme-illustrations/zh-CN/
          cp docs/assets/brand/qingye-wordmark-blue.svg _site/docs/assets/brand/
          cp docs/assets/brand/en/hengmu-icon.svg \
            docs/assets/brand/en/hengmu-banner.png \
            _site/docs/assets/brand/en/
          cp docs/assets/brand/zh-CN/hengmu-icon.svg \
            docs/assets/brand/zh-CN/hengmu-banner.png \
            _site/docs/assets/brand/zh-CN/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site/i18n.json
          if find _site -type l -print -quit | grep -q .; then
            echo "GitHub Pages artifact must not contain symlinks" >&2
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
