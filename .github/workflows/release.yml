name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release tests verify benchmark evidence against its archived commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked development dependencies
        run: >-
          python -m pip install --require-hashes
          --requirement requirements-dev.lock

      - name: Verify tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(".codex-plugin/plugin.json").read_text(encoding="utf-8")
          )
          expected = f"v{manifest['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match {expected!r}")
          PY

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Validate dogfood architecture profile
        run: python resources/scripts/architecture_tool.py validate-project .

      - name: Validate governance history anchors
        run: python resources/scripts/architecture_tool.py validate-history-anchors .

      - name: Validate architecture knowledge
        run: python resources/scripts/validate_knowledge.py

      - name: Run tests
        run: python -m pytest

      - name: Run layered architecture release gate
        run: >-
          python resources/scripts/architecture_tool.py gate
          --project .
          --stage release

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Audit runtime dependencies
        run: python -m pip_audit --requirement requirements-runtime.lock

      - name: Audit runtime dependency licenses
        run: python scripts/audit_licenses.py

      - name: Build deterministic plugin archive
        run: python scripts/package_plugin.py --output-dir dist

      - name: Verify archive checksum
        run: python scripts/verify_checksum.py dist/*.zip.sha256

      - name: Define release artifact paths
        shell: bash
        run: >-
          echo
          "SBOM_PATH=dist/hengmu-${GITHUB_REF_NAME#v}.spdx.json"
          >> "${GITHUB_ENV}"

      - name: Generate SPDX SBOM
        run: >-
          python scripts/generate_sbom.py
          --archive dist/*.zip
          --output "${SBOM_PATH}"

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.zip

      - name: Attest SPDX SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.zip
          sbom-path: ${{ env.SBOM_PATH }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.zip.sha256 \
            "${SBOM_PATH}" \
            --generate-notes \
            --title "Hengmu ${GITHUB_REF_NAME}"
