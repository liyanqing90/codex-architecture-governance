name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(".codex-plugin/plugin.json").read_text(encoding="utf-8")
          )
          expected = f"v{manifest['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match {expected!r}")
          PY

      - name: Validate repository contracts
        run: python scripts/validate_repository.py

      - name: Validate dogfood architecture profile
        run: python resources/scripts/architecture_tool.py validate-project .

      - name: Run tests
        run: python -m pytest

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Build deterministic plugin archive
        run: python scripts/package_plugin.py --output-dir dist

      - name: Verify archive checksum
        run: cd dist && sha256sum --check *.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.zip.sha256 \
            --generate-notes \
            --title "Codex Architecture Governance ${GITHUB_REF_NAME}"
