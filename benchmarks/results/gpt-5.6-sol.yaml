          rendering failure to the API. The current worker already provides idempotent
          completion through has_result and commit_result_once (worker.py:2-5), so
          removal adds migration risk without a proven benefit.
      - id: durable-workflow
        reason: README.md:3-5 directly states that jobs are short and have no branching,
          approval, compensation, or pause/resume requirement, while database status
          and an at-least-once queue already supply the required state and delivery
          mechanism. A workflow runtime would add orchestration and operational complexity
          without a demonstrated recovery gap.
      - id: event-driven-services
        reason: The fixture has one team, one API, and one worker (README.md:3), with
          one database-owned task status and no evidence of independently deployed
          consumers or team boundaries. Additional event-driven service boundaries
          would increase routing and ownership complexity without a proven requirement.
      migration_slices:
      - Retain the existing API-to-queue-to-worker route and database-owned task status
        for all jobs; rollback requires no action because no runtime boundary changes.
      - If multi-step waits, approvals, compensation, or pause/resume requirements
        emerge, model those states in a non-authoritative workflow prototype while
        the queue remains authoritative; rollback by deleting the prototype route.
      - Route only newly created jobs from a bounded cohort to a workflow after restart
        and duplicate-delivery parity is demonstrated; rollback by routing new jobs
        back to the queue and draining already-started workflow jobs separately.
