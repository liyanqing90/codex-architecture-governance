      rejected_options:
      - id: durable-workflow
        reason: README.md directly states that jobs are short and idempotent, with
          no branching, approval, compensation, or pause/resume requirement. Database-owned
          status and the existing queue are sufficient, so a workflow runtime would
          add replay, versioning, history, and operational complexity without a demonstrated
          recovery benefit.
      - id: microservices
        reason: README.md directly states that one team runs one API and one worker.
          No independent team ownership, deployment, scaling, or isolation requirement
          is evidenced, so service decomposition would add distributed consistency,
          observability, compatibility, and operational costs without demonstrated
          value.
      migration_slices:
      - Retain the existing API-to-queue-to-worker path, database-owned task status,
        and at-least-once delivery unchanged; rollback is a no-op because this slice
        introduces no structural migration.
      - Preserve the current process(job, store, renderer) boundary and commit-once
        behavior so a future orchestration experiment can wrap it as one activity
        without changing result ownership; rollback removes the wrapper and invokes
        the worker directly.
      - If multi-step work, timers, or pause/resume requirements emerge, route only
        new jobs to a workflow behind a reversible routing flag while existing queue
        jobs drain; rollback sends new jobs back to the current queue and leaves in-flight
        jobs on their original path.
