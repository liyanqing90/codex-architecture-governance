      - id: durable-workflow
        reason: Rejected because README.md directly describes short, idempotent jobs
          with no branching, approval, compensation, or pause/resume requirement,
          while the database already owns status and the queue supplies delivery.
          A workflow runtime would add orchestration, replay, versioning, and operational
          complexity without a demonstrated recovery gap.
      - id: durable-event-stream
        reason: Rejected because README.md describes one API, one worker, and task
          delivery through a queue; it provides no evidence of replay, audit history,
          ordered partition history, fan-out, or independent consumers. Stream retention
          and consumer-offset operations would add cost and complexity without a supported
          requirement.
      - id: publish-subscribe
        reason: Rejected because the fixture identifies a single worker and no independent
          subscribers. Broadcasting each job would not improve the demonstrated one-consumer
          work-distribution path and would add subscription and delivery coordination.
      migration_slices:
      - Retain the existing queue, database-owned task status, and worker boundary;
        verify duplicate delivery by invoking process twice for the same job ID and
        confirming only one committed result.
      - Introduce any future messaging or workflow candidate behind the existing job-consumer
        interface and shadow it without committing renderer results; remove the shadow
        path to roll back.
      - If multi-step recovery requirements are later demonstrated, route only newly
        created jobs to a durable-workflow path while existing jobs drain through
