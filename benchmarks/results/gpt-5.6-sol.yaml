- id: server-cache-mobile
  fixture: benchmarks/fixtures/mobile-record-editor
  expected_findings: []
  forbidden_recommendations: []
  observed_findings: &id013 []
  observed_recommendations: &id014 []
  trials:
  - index: 1
    duration_seconds: 71.71684795799956
    observed_findings: *id013
    observed_recommendations: *id014
    observed_decision: &id015
      selected_option: server-first-with-local-cache
      compared_tradeoffs:
      - offline-capability
      - client-complexity
      - consistency
      - latency
      - reliability
      - recovery
      - implementation-complexity
      - operational-complexity
      - maintainability
      - migration-risk
      - reversibility
      - cost
      knowledge_ids:
      - decision.client-data-model-selection
      - decision.local-first-vs-server-first
      - reference.server-first-mobile-client
      rejected_options:
      - id: offline-queue-over-server-authority
        reason: README.md states that edits require a network and offline editing
          is explicitly not a product requirement, so command durability, ordering,
          idempotency, expiry, replay, and rejection handling add unsupported complexity.
      - id: local-first-replicated-data
        reason: README.md defines the local store as an expiring, discardable display
          cache and Repository.swift sends updates directly to the API before invalidating
          cached data; no requirement supports writable replicas, conflict resolution,
          convergence, tombstones, or synchronization.
      migration_slices:
      - 'Retain the current server-authoritative write slice: keep Repository.update
        calling api.update before cache invalidation; the unchanged implementation
        remains the rollback point.'
      - 'Retain the bounded read-cache slice: keep fresh cached items for display,
        fetch from the API on a miss, and allow the cache to be discarded without
        affecting authoritative data.'
      - If offline editing later becomes an explicit requirement, pilot one idempotent
        queued command behind a reversible feature boundary before adding broader
        synchronization; disable that boundary to return to server-first writes.
  - index: 2
    duration_seconds: 72.49590945900127
    observed_findings: []
    observed_recommendations: []
