      - style.durable-workflow
      - style.microservices
      - decision.system-style-selection
      - decision.request-vs-background-job
      - pattern.idempotency-key
      rejected_options:
      - id: durable-workflow
        reason: README.md states that jobs have no branching, approval, compensation,
          or pause/resume requirement, while the database already owns status and
          the queue supplies at-least-once delivery. A workflow runtime would add
          replay, history, versioning, and operational complexity without a demonstrated
          orchestration need.
      - id: inline-request-work
        reason: Although jobs are short, README.md directly establishes an API-to-queue-to-worker
          architecture with database-owned status and at-least-once delivery. Moving
          rendering inline would discard those existing delivery and status boundaries
          without evidence that immediate completion is required, adding migration
          risk for no demonstrated benefit.
      - id: microservices
        reason: README.md identifies one team operating one API and one worker. There
          is no evidence of autonomous teams or independent release requirements,
          so broader service decomposition would add distributed operations and contract-governance
          costs without demonstrated benefit.
      migration_slices:
      - Record the existing API-to-queue-to-worker path and database-owned task status
        as the compatibility baseline; this documentation-only slice is reversible
        by removing the baseline record.
      - Add a focused duplicate-delivery test that invokes the worker twice with the
        same job ID and verifies one committed result; this test-only slice is reversible
        without changing runtime behavior.
      - Exercise one render job through the existing queue path and verify its database
        status and result before making any structural change; retain the current
        path unless this baseline fails.
      - If future evidence demonstrates multi-step waits, approvals, compensation,
        or restart-sensitive orchestration, introduce one workflow-backed job type
        behind the existing job boundary while retaining queue routing as rollback,
        then expand only after recovery tests pass.
