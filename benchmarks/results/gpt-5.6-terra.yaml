      - style.microservices
      - case-study.queue-worker-before-workflow
      - migration.queue-to-durable-workflow
      rejected_options:
      - id: durable-workflow
        reason: Rejected because the workload is short and explicitly has no branching,
          approval, compensation, or pause/resume requirement; the existing database-owned
          task status and at-least-once queue delivery already supply the stated durable
          boundary.
      - id: microservices
        reason: Rejected because one team operates one API and one worker, with no
          evidence of independent deployment, scaling, or autonomous ownership needs
          that would justify distributed operational and consistency costs.
      migration_slices:
      - Preserve the current API-to-queue submission contract and database task-status
        boundary as the compatibility seam.
      - If a future requirement introduces durable multi-step orchestration, route
        only newly created job IDs to a workflow path while existing queue jobs continue
        on the worker.
      - Drain the legacy queue before removing its consumer; rollback by returning
        new job IDs to the unchanged queue-worker path before either path is deleted.
