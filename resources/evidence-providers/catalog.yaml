schema_version: "1.1"
providers:
  - {id: archunit, evidence_type: static, detect: ["pom.xml", "build.gradle", "build.gradle.kts"], command: ["project-defined ArchUnit test command"], output: text, trust: deterministic, documentation: "https://www.archunit.org/userguide/html/000_Index.html", notes: ["Use project-owned rules; do not invent package boundaries."]}
  - {id: dependency-cruiser, evidence_type: static, detect: ["package.json"], command: ["./node_modules/.bin/depcruise", "--output-type", "json", "src"], output: json, trust: deterministic, documentation: "https://github.com/sverweij/dependency-cruiser", ecosystem: javascript-typescript, category: architecture, missing_tool_guidance: "dependency-cruiser is unavailable. Add the pinned project dependency and restore the lockfile-owned environment with explicit user approval; do not use npx to install it.", notes: ["Use a pinned project-local dependency in CI; never use a package runner that can download it."]}
  - {id: import-linter, evidence_type: static, detect: ["pyproject.toml", ".importlinter"], command: ["lint-imports"], output: text, trust: deterministic, documentation: "https://import-linter.readthedocs.io/", notes: ["Contracts must reflect owned package boundaries."]}
  - {id: semgrep, evidence_type: security, detect: [".semgrep.yml", ".semgrep.yaml"], command: ["semgrep", "--config", ".semgrep.yml", "--sarif"], output: sarif, trust: deterministic, documentation: "https://semgrep.dev/docs/", notes: ["Treat generic findings as leads unless a repository rule encodes the invariant."]}
  - {id: codeql, evidence_type: security, detect: [".github/workflows"], command: ["codeql database analyze"], output: sarif, trust: deterministic, documentation: "https://codeql.github.com/docs/", notes: ["Use GitHub-maintained language queries or repository-owned packs."]}
  - {id: openapi-diff, evidence_type: contract, detect: ["openapi.yaml", "openapi.json"], command: ["project-defined OpenAPI diff command"], output: json, trust: deterministic, documentation: "https://www.openapis.org/", notes: ["Compare against an explicit released baseline."]}
  - {id: migration-check, evidence_type: contract, detect: ["migrations", "alembic.ini"], command: ["project-defined migration validation command"], output: exit-code, trust: deterministic, notes: ["Require forward and rollback or compensating recovery evidence."]}
  - {id: test-results, evidence_type: test, detect: ["pytest.ini", "pyproject.toml", "package.json", "pom.xml"], command: ["project-defined test command"], output: junit, trust: deterministic, notes: ["Map tests to critical flows and owning-boundary invariants."]}
  - {id: opentelemetry, evidence_type: runtime, detect: ["otel-config.yaml", "collector-config.yaml"], command: ["project-defined trace query"], output: json, trust: runtime-observation, documentation: "https://opentelemetry.io/docs/", notes: ["Redact sensitive attributes and record observation window."]}
  - {id: kubernetes-manifest, evidence_type: static, detect: ["kustomization.yaml", "Chart.yaml"], command: ["project-defined manifest validation command"], output: text, trust: deterministic, documentation: "https://kubernetes.io/docs/concepts/", notes: ["Manifest validity does not prove runtime availability."]}
  - {id: sbom, evidence_type: supply-chain, detect: ["requirements.txt", "package-lock.json", "pom.xml"], command: ["project-defined SBOM generator"], output: json, trust: deterministic, documentation: "https://spdx.dev/", notes: ["Bind generated SBOM to the release artifact digest."]}
  - id: ruff
    evidence_type: static
    detect: ["pyproject.toml", "ruff.toml", ".ruff.toml"]
    command: ["ruff", "check", "."]
    output: text
    trust: deterministic
    documentation: "https://docs.astral.sh/ruff/"
    ecosystem: python
    category: quality
    missing_tool_guidance: "Ruff is unavailable. Add the pinned Ruff dependency to the project environment and obtain explicit user approval before installing it."
    notes: ["Use the project-owned interpreter and lockfile; this provider never installs Ruff."]
  - id: eslint
    evidence_type: static
    detect: ["package.json", "eslint.config.js", "eslint.config.mjs", ".eslintrc", ".eslintrc.js", ".eslintrc.cjs", ".eslintrc.json"]
    command: ["./node_modules/.bin/eslint", "."]
    output: text
    trust: deterministic
    documentation: "https://eslint.org/docs/latest/use/command-line-interface"
    ecosystem: javascript-typescript
    category: quality
    missing_tool_guidance: "ESLint is unavailable. Add the pinned project dependency and restore the project environment with explicit user approval; do not allow npx to install it."
    notes: ["Resolve the project-local binary from a lockfile-restored dependency tree; do not use a package runner that can download ESLint."]
  - id: clippy
    evidence_type: static
    detect: ["Cargo.toml", "Cargo.lock", "rust-toolchain", "rust-toolchain.toml"]
    command: ["cargo", "clippy", "--offline", "--all-targets", "--all-features", "--", "-D", "warnings"]
    output: text
    trust: deterministic
    documentation: "https://doc.rust-lang.org/clippy/"
    ecosystem: rust
    category: quality
    missing_tool_guidance: "Clippy is unavailable. Add the required component to the project-owned Rust toolchain with explicit user approval; do not install it automatically."
    notes: ["Pin the Rust toolchain with rust-toolchain.toml or rust-toolchain and keep dependency resolution project-owned."]
  - id: golangci-lint
    evidence_type: static
    detect: ["go.mod", "go.sum", ".golangci.yml", ".golangci.yaml"]
    command: ["golangci-lint", "run"]
    output: text
    trust: deterministic
    documentation: "https://golangci-lint.run/docs/configuration/cli/"
    ecosystem: go
    category: quality
    missing_tool_guidance: "golangci-lint is unavailable. Provision the project-pinned binary or toolchain with explicit user approval; do not run an installer automatically."
    notes: ["Use a project-owned, version-pinned golangci-lint binary or tool declaration; the catalog does not install it."]
  - id: swiftlint
    evidence_type: static
    detect: ["Package.swift", ".swiftlint.yml", ".swiftlint.yaml", "*.xcodeproj", "*.xcworkspace"]
    command: ["swiftlint", "lint", "--strict"]
    output: text
    trust: deterministic
    documentation: "https://realm.github.io/SwiftLint/"
    ecosystem: swift
    category: quality
    missing_tool_guidance: "SwiftLint is unavailable. Add the project-pinned SwiftLint tool or package plugin with explicit user approval; do not install it automatically."
    notes: ["Prefer the repository's pinned Swift package, plugin, or binary path over a global installation."]
  - id: detekt
    evidence_type: static
    detect: ["settings.gradle", "settings.gradle.kts", "build.gradle", "build.gradle.kts", "gradlew"]
    command: ["gradle", "--offline", "detekt"]
    output: text
    trust: deterministic
    documentation: "https://detekt.dev/docs/gettingstarted/gradletask/"
    ecosystem: jvm
    category: quality
    missing_tool_guidance: "Detekt is unavailable. Declare the pinned Detekt Gradle plugin in the project build and obtain explicit user approval before resolving it."
    notes: ["Use a pre-provisioned Gradle executable and project-pinned plugin in offline mode; this provider never resolves or installs Detekt."]
