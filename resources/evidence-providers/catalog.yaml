schema_version: "1.1"
providers:
  - {id: archunit, evidence_type: static, detect: ["pom.xml", "build.gradle", "build.gradle.kts"], command: ["project-defined ArchUnit test command"], output: text, trust: deterministic, documentation: "https://www.archunit.org/userguide/html/000_Index.html", notes: ["Use project-owned rules; do not invent package boundaries."]}
  - {id: dependency-cruiser, evidence_type: static, detect: ["package.json"], command: ["npx", "depcruise", "--output-type", "json", "src"], output: json, trust: deterministic, documentation: "https://github.com/sverweij/dependency-cruiser", notes: ["Use a pinned project dependency in CI."]}
  - {id: import-linter, evidence_type: static, detect: ["pyproject.toml", ".importlinter"], command: ["lint-imports"], output: text, trust: deterministic, documentation: "https://import-linter.readthedocs.io/", notes: ["Contracts must reflect owned package boundaries."]}
  - {id: semgrep, evidence_type: security, detect: [".semgrep.yml", ".semgrep.yaml"], command: ["semgrep", "--config", ".semgrep.yml", "--sarif"], output: sarif, trust: deterministic, documentation: "https://semgrep.dev/docs/", notes: ["Treat generic findings as leads unless a repository rule encodes the invariant."]}
  - {id: codeql, evidence_type: security, detect: [".github/workflows"], command: ["codeql database analyze"], output: sarif, trust: deterministic, documentation: "https://codeql.github.com/docs/", notes: ["Use GitHub-maintained language queries or repository-owned packs."]}
  - {id: openapi-diff, evidence_type: contract, detect: ["openapi.yaml", "openapi.json"], command: ["project-defined OpenAPI diff command"], output: json, trust: deterministic, documentation: "https://www.openapis.org/", notes: ["Compare against an explicit released baseline."]}
  - {id: migration-check, evidence_type: contract, detect: ["migrations", "alembic.ini"], command: ["project-defined migration validation command"], output: exit-code, trust: deterministic, notes: ["Require forward and rollback or compensating recovery evidence."]}
  - {id: test-results, evidence_type: test, detect: ["pytest.ini", "pyproject.toml", "package.json", "pom.xml"], command: ["project-defined test command"], output: junit, trust: deterministic, notes: ["Map tests to critical flows and owning-boundary invariants."]}
  - {id: opentelemetry, evidence_type: runtime, detect: ["otel-config.yaml", "collector-config.yaml"], command: ["project-defined trace query"], output: json, trust: runtime-observation, documentation: "https://opentelemetry.io/docs/", notes: ["Redact sensitive attributes and record observation window."]}
  - {id: kubernetes-manifest, evidence_type: static, detect: ["kustomization.yaml", "Chart.yaml"], command: ["project-defined manifest validation command"], output: text, trust: deterministic, documentation: "https://kubernetes.io/docs/concepts/", notes: ["Manifest validity does not prove runtime availability."]}
  - {id: sbom, evidence_type: supply-chain, detect: ["requirements.txt", "package-lock.json", "pom.xml"], command: ["project-defined SBOM generator"], output: json, trust: deterministic, documentation: "https://spdx.dev/", notes: ["Bind generated SBOM to the release artifact digest."]}
