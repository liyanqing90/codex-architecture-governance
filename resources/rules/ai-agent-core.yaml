schema_version: "1.1"
id: ai-agent-core
version: "1.1.0"
review_kind: ai-agent
rules:
  - {id: AI.BOUNDARY.001, domain: agent-boundary, invariant: "Model judgment is used only where probabilistic behavior is acceptable and deterministic policy remains authoritative.", evidence_requirements: ["Trace model output to policy and side effects."], quality_attributes: [safety, security]}
  - {id: AI.CONTEXT.001, domain: context, invariant: "Context has explicit sources, scope, size limits, freshness, redaction, and disposal.", evidence_requirements: ["Inspect context construction and lifecycle."], quality_attributes: [security, reliability]}
  - {id: AI.CONTEXT.002, domain: context-source-inventory, invariant: "Every assembled context source has an owner, purpose, necessity, authority, scope, freshness, sensitivity, transformation, retention, and disposal decision.", evidence_requirements: ["Inventory included and excluded sources and prove why each source is necessary for the affected critical flow.", "Bind excess, omission, or undocumented source authority to a concrete affected critical flow and failure path."], quality_attributes: [security, reliability, maintainability]}
  - {id: AI.CONTEXT.003, domain: context-budget-integrity, invariant: "Context budgets and compression preserve authoritative instructions, provenance, and the recency needed by the critical flow, or fail closed with an explicit loss record.", evidence_requirements: ["Trace truncation, summarization, ranking, and fallback under budget pressure and inspect preservation of authority, provenance, and recency.", "Bind lossy or unbounded behavior to a concrete affected critical flow and failure path."], quality_attributes: [security, reliability, performance-efficiency]}
  - {id: AI.CONTEXT.004, domain: context-order-and-cache, invariant: "Context ordering and cache boundaries are stable, scoped, observable, and invalidated when authorization, provenance, or relevant content changes.", evidence_requirements: ["Compare ordering, cache keys, reuse, and invalidation across retries, tasks, tenants, and releases.", "Bind ordering or cache-boundary drift to a concrete affected critical flow and failure path."], quality_attributes: [security, reliability, performance-efficiency]}
  - {id: AI.CONTEXT.005, domain: context-stability, invariant: "Stable policy, contracts, and instructions are separated from volatile user, retrieval, task-state, and provider context at assembly and cache boundaries.", evidence_requirements: ["Classify stable and volatile context and inspect whether volatile or sensitive material can enter reusable stable context.", "Bind a stability or cache classification error to a concrete affected critical flow and failure path."], quality_attributes: [security, reliability, maintainability]}
  - {id: AI.MEMORY.001, domain: memory-tiers, invariant: "Working, episodic, semantic, and durable memories have distinct ownership, retention, update, and retrieval semantics.", evidence_requirements: ["Trace each memory tier and owner."], quality_attributes: [reliability, maintainability]}
  - {id: AI.MEMORY.002, domain: memory-isolation, invariant: "User, tenant, task, and agent memories cannot leak across scopes.", evidence_requirements: ["Identify scope keys, filters, writers, and readers."], quality_attributes: [security, privacy]}
  - {id: AI.PROVENANCE.001, domain: provenance, invariant: "Claims and durable memories preserve source, time, transformation, confidence, and contradiction history.", evidence_requirements: ["Trace a durable claim to original evidence."], quality_attributes: [traceability, reliability]}
  - {id: AI.TOOL.001, domain: tool-authorization, invariant: "Tool access is allowlisted by identity, task, scope, arguments, and side-effect class.", evidence_requirements: ["Trace tool authorization and parameter validation."], quality_attributes: [security, safety]}
  - {id: AI.TOOL.002, domain: side-effects, invariant: "Important or irreversible actions require deterministic validation and declared human confirmation.", evidence_requirements: ["Trace side effects to validation and approval."], quality_attributes: [safety, security]}
  - {id: AI.INJECTION.001, domain: prompt-injection, invariant: "Untrusted instructions cannot override policy, obtain credentials, or expand tool authority.", evidence_requirements: ["Trace untrusted content to authority-expanding sinks."], quality_attributes: [security]}
  - {id: AI.SECRET.001, domain: secrets, invariant: "Prompts, traces, providers, retrieval stores, and tool outputs expose no unnecessary secrets or personal data.", evidence_requirements: ["Inspect data sent to models, tools, stores, and logs."], quality_attributes: [security, privacy]}
  - {id: AI.PRIVACY.001, domain: data-minimization, invariant: "Sensitive and personal data is minimized by purpose, field, scope, retention, and representation across prompts, retrieval, memory, and traces.", evidence_requirements: ["Inspect field-level allowlists, redaction, purpose limitation, scope, retention, deletion, and reference-versus-raw-content choices at each data boundary.", "Bind unnecessary exposure or retention to a concrete affected critical flow and failure path."], quality_attributes: [security, privacy]}
  - {id: AI.STATE.001, domain: long-tasks, invariant: "Plans and workflows have durable state, checkpoints, cancellation, resumption, and terminal outcomes.", evidence_requirements: ["Trace interruption between two side-effecting steps."], quality_attributes: [reliability, recoverability]}
  - {id: AI.IDEMPOTENCY.001, domain: repeated-actions, invariant: "Model retries and resumed tasks cannot duplicate external side effects.", evidence_requirements: ["Trace retry identity and deduplication."], quality_attributes: [reliability, safety]}
  - {id: AI.MODEL.001, domain: routing, invariant: "Model selection, capability assumptions, versions, timeouts, and fallbacks are explicit and observable.", evidence_requirements: ["Inspect routing configuration and traces."], quality_attributes: [reliability, performance-efficiency]}
  - {id: AI.DEGRADE.001, domain: degraded-mode, invariant: "Provider failure, rate limits, context overflow, and low confidence have safe product behavior.", evidence_requirements: ["Trace each declared failure mode."], quality_attributes: [reliability, safety]}
  - {id: AI.EVAL.001, domain: evaluation, invariant: "Critical AI capabilities have representative offline evaluations and production signals tied to releases.", evidence_requirements: ["Map critical capabilities to eval cases and release gates."], quality_attributes: [reliability, functional-suitability]}
  - {id: AI.EVAL.002, domain: behavior-evidence, invariant: "Behavior evidence is reproducibly bound to the exact model/runtime, prompt, tool policy and schema, retriever/index/ranking configuration, context treatment, evaluation data, environment, and time.", evidence_requirements: ["Inspect version identifiers and hashes for model/runtime, prompt, tools, retriever, context, evaluation data, environment, and execution time.", "Bind unversioned or incomparable behavior evidence to a concrete affected critical flow and failure path."], quality_attributes: [traceability, reliability, maintainability]}
  - {id: AI.HUMAN.001, domain: human-oversight, invariant: "Approval points sit at actual risk boundaries and show evidence, scope, and consequences.", evidence_requirements: ["Inspect approval timing and displayed context."], quality_attributes: [safety]}
  - {id: AI.COST.001, domain: cost-latency, invariant: "Token, tool, retrieval, and retry budgets are bounded per task and visible operationally.", evidence_requirements: ["Inspect budgets and usage signals."], quality_attributes: [performance-efficiency]}
  - {id: AI.OBSERVABILITY.001, domain: traceability, invariant: "A task can be reconstructed across prompts, models, retrieval, tools, transitions, and approvals without leaking sensitive content.", evidence_requirements: ["Follow one task correlation identifier."], quality_attributes: [traceability, security]}
  - {id: AI.RECOVERY.001, domain: recovery, invariant: "Partial model or tool failure has explicit retry ownership, compensation, and escalation.", evidence_requirements: ["Trace failure after a committed side effect."], quality_attributes: [recoverability, reliability]}
  - {id: AI.MULTIAGENT.001, domain: coordination, invariant: "Multiple agents have clear ownership, handoff contracts, conflict handling, and bounded shared state.", evidence_requirements: ["Inspect handoffs and shared state concurrency."], quality_attributes: [reliability, maintainability]}
  - {id: AI.CHANGE.001, domain: evolution, invariant: "Prompt, model, tool, retrieval, and policy changes are versioned and evaluated before rollout.", evidence_requirements: ["Inspect version and release evidence."], quality_attributes: [maintainability, reliability]}
  - {id: AI.CHANGE.002, domain: upgrade-decision, invariant: "Adoption, retention, or rejection of a new or upgraded agent runtime, protocol, model, or framework is evidence-based against the current baseline and critical-flow requirements.", evidence_requirements: ["Compare adopt, retain, and reject options using critical-flow scenarios and evidence for quality, compatibility, security, operations, cost, ownership, rollout, and rollback.", "State findings as invariant or capability outcomes, not technology-name judgments, and bind the decision to a concrete affected critical flow and evidence path."], quality_attributes: [reliability, maintainability, security, performance-efficiency]}
