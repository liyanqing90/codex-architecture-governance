decision:
  id: ADR-ORDER-TARGET-001
  decision_kind: greenfield
  architecture_intent: target-architecture
  assessment_kind: standard
  source_context: .architecture/architecture-design-brief.yaml
  source_context_sha256: "ea5abf99454c5ed961ff1a254301c1996b57a1b0c49a47c94a7a52663c3a070e"
  decided_at: "2026-08-20T15:00:00+08:00"
  decision_makers:
    - platform-architecture-team
    - order-domain-lead
    - operations-lead
  status: proposed
  knowledge_selection_path: .architecture/knowledge-selection.yaml
  knowledge_selection_sha256: "c7a4e2d1f53b9a9e0b1d6c8f4a7e3d2c1b9f8e7d6c5a4b3c2d1e0f9a8b7c6d5e"
problem:
  quality_attributes:
    - reliability
    - auditability
  constraints:
    - modular-boundaries
    - relational-order-records
    - synchronous-checkout
    - single-production-deployment
  finding_ids: []
  assumptions:
    - One product team owns checkout and fulfillment through launch.
    - The payment provider supports idempotency keys and replayable webhooks.
  known_facts:
    - The launch deployment is single-region and operated by one on-call rotation.
    - Checkout requires an immediate customer-visible authorization result.
  unknowns:
    - Seasonal peak concurrency must be confirmed by a load rehearsal.
    - Provider webhook delay under failure must be measured before acceptance.
