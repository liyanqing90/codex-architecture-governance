schema_version: "1.1"
# Before enabling a deterministic provider, add project-contained
# dependency_inputs (locks, configs, plugins, or dependency trees) and set
# cache_mode: isolated. The runner rejects deterministic execution without both.
providers:
  - id: archunit
    enabled: false
    command: ["mvn", "--offline", "test", "-Dtest=*ArchitectureTest"]
    timeout_seconds: 600
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, JAVA_HOME]
    output_source: stdout
  - id: dependency-cruiser
    enabled: false
    command: ["./node_modules/.bin/depcruise", "--output-type", "json", "src"]
    timeout_seconds: 300
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL]
    output_source: stdout
  - id: import-linter
    enabled: false
    command: ["lint-imports"]
    timeout_seconds: 300
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, VIRTUAL_ENV]
    output_source: stdout
  - id: semgrep
    enabled: false
    command: ["semgrep", "--config", ".semgrep.yml", "--sarif"]
    timeout_seconds: 600
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL]
    output_source: stdout
  - id: codeql
    enabled: false
    command: ["codeql", "database", "analyze", "codeql-db", "--format=sarif-latest", "--output={evidence_output}"]
    timeout_seconds: 1800
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL]
    output_source: file
    result_path: "{evidence_output}"
  - id: openapi-diff
    enabled: false
    command: ["openapi-diff", "baseline/openapi.yaml", "openapi.yaml", "--json"]
    timeout_seconds: 300
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL]
    output_source: stdout
  - id: migration-check
    enabled: false
    command: ["python", "-m", "pytest", "-q", "tests/migrations"]
    timeout_seconds: 600
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, VIRTUAL_ENV]
    output_source: stdout
  - id: test-results
    enabled: false
    command: ["python", "-m", "pytest", "-q", "--junitxml={evidence_output}"]
    timeout_seconds: 1200
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, VIRTUAL_ENV]
    output_source: file
    result_path: "{evidence_output}"
  - id: opentelemetry
    enabled: false
    command: ["otel-cli", "status"]
    timeout_seconds: 300
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL]
    output_source: stdout
  - id: kubernetes-manifest
    enabled: false
    command: ["kubectl", "kustomize", "."]
    timeout_seconds: 300
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL]
    output_source: stdout
  - id: sbom
    enabled: false
    command: ["syft", ".", "-o", "spdx-json"]
    timeout_seconds: 600
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL]
    output_source: stdout
  - id: ruff
    enabled: false
    command: ["ruff", "check", "."]
    timeout_seconds: 300
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, VIRTUAL_ENV]
    output_source: stdout
  - id: eslint
    enabled: false
    command: ["./node_modules/.bin/eslint", "."]
    timeout_seconds: 300
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, NODE_PATH]
    output_source: stdout
  - id: clippy
    enabled: false
    command: ["cargo", "clippy", "--offline", "--all-targets", "--all-features", "--", "-D", "warnings"]
    timeout_seconds: 1200
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, CARGO_HOME, RUSTUP_HOME]
    output_source: stdout
  - id: golangci-lint
    enabled: false
    command: ["golangci-lint", "run"]
    timeout_seconds: 600
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, GOPATH, GOMODCACHE]
    output_source: stdout
  - id: swiftlint
    enabled: false
    command: ["swiftlint", "lint", "--strict"]
    timeout_seconds: 600
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, HOME]
    output_source: stdout
  - id: detekt
    enabled: false
    command: ["gradle", "--offline", "detekt"]
    timeout_seconds: 1200
    success_exit_codes: [0]
    allow_without_detection: false
    environment_allowlist: [PATH, LANG, LC_ALL, JAVA_HOME, GRADLE_USER_HOME]
    output_source: stdout
