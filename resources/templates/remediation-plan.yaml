items:
  - id: PLAN-ORDER-BOUNDARIES-001
    knowledge_ids:
      - style.modular-monolith
      - pattern.idempotency-key
      - technology.fastapi
      - technology.postgresql
    assumptions:
      - The launch team can own all four runtime units within one deployable application.
      - The payment provider accepts an idempotency key for every authorization request.
    target_bindings:
      runtime_units:
        - checkout-api
        - order-domain
        - payment-adapter
        - fulfillment-coordinator
      deployment_units:
        - order-application-prod
      data_owners:
        - order-records
        - payment-records
        - fulfillment-handoffs
      interfaces:
        - submit-checkout
        - create-order
        - authorize-payment
        - receive-provider-webhook
        - record-payment-result
        - enqueue-fulfillment
        - send-fulfillment-request
      trust_boundaries:
        - public-api-boundary
        - payment-provider-boundary
        - fulfillment-partner-boundary
        - operator-access-boundary
      technologies:
        - technology.fastapi
        - technology.postgresql
      critical_flows:
        - checkout-authorization
        - payment-reconciliation
      constraints:
        - modular-boundaries
        - relational-order-records
        - synchronous-checkout
        - single-production-deployment
    desired_invariant: Each order and payment transition has one owning module, one durable record, and one replay-safe command path.
    owner: order-platform-team
    recommended_option:
      title: Implement the modular monolith target architecture
      rationale: It satisfies the accepted target boundaries while keeping deployment and recovery simple for the launch team.
      tradeoffs:
        - Module contracts and architecture tests add implementation work before the first release.
        - A later service extraction will require preserving these contracts and ownership records.
    alternatives:
      - title: Keep informal boundaries in the current application
        when_preferred: Prefer this only when the target architecture is withdrawn and launch timing prevents boundary work.
        tradeoffs:
          - Lower initial effort but no executable ownership invariant.
          - Greater risk of duplicate authorization and incomplete audit history.
      - title: Split checkout and payment into separate services
        when_preferred: Prefer this after measured volume or team ownership requires independent deployment.
        tradeoffs:
          - Adds distributed timeout, retry, tracing, and data-ownership complexity.
          - Requires a staffed operating model before launch.
    do_nothing: Without explicit ownership, duplicate checkout retries can create conflicting payment state and leave audit transitions incomplete.
    effort:
      size: m
      uncertainty: medium
      assumptions:
        - Existing checkout behavior can be covered by contract tests before module extraction.
        - Database changes can be deployed with backward-compatible columns and indexes.
    change_risk: high
    governed_change: true
    dependencies:
      - payment-provider-test-credentials
      - PostgreSQL-backup-verification
      - fulfillment-partner-contract
    sequence:
      - Capture current checkout and webhook behavior with contract tests.
      - Establish module ownership, interfaces, and durable transition records.
      - Add idempotent payment authorization and provider-event deduplication.
      - Enable fulfillment handoff after critical-flow evidence passes.
    test_protection:
      - Prove one authorization for repeated checkout commands with one idempotency key.
      - Prove every order and payment transition includes owner, actor, request, and timestamp.
      - Prove delayed and replayed provider webhooks converge to one payment state.
    rollback: Disable the new route, retain the compatible transition columns, and replay durable provider events through the previous handler until the invariant is restored.
    migration_type: mixed
    data_compatibility: Additive transition records preserve existing order identifiers and allow old readers to ignore new audit fields during rollout.
    deployment_strategy: Roll out database additions first, then the application behind a feature flag, and enable fulfillment handoff only after mixed-version checks pass.
    observability_changes:
      - Emit checkout idempotency-hit and duplicate-prevention counters.
      - Emit provider latency, webhook replay, transition-owner, and reconciliation-lag metrics.
    stop_conditions:
      - Stop rollout if duplicate authorization count is non-zero in the rehearsal window.
      - Stop rollout if any transition lacks an owner or durable correlation identifier.
      - Stop rollout if webhook replay does not converge within the recovery objective.
    acceptance_criteria:
      - Repeated checkout requests with one idempotency key create exactly one authorization.
      - The primary checkout flow reaches fulfillment with all four target bindings observable.
      - A delayed or replayed provider webhook converges without changing the final order outcome.
    acceptance_evidence_types:
      - test
      - contract
      - runtime
      - operational
    completion_evidence: []
