        - Replace with one directly observed repository fact.
      inferences:
        - Replace with one bounded interpretation of the facts.
      unknowns:
        - Replace with evidence that remains unavailable.
    applicability:
      profile_conditions:
        - Replace with the profile condition that makes this Finding applicable.
    source_candidate_ids:
      - example-project-19700101-project
