      affected_components:
        - example-component
      failure_mode: Replace with the credible failure or change-cost path.
      blast_radius: Replace with the bounded affected scope.
    counter_evidence: []
    first_seen: "1970-01-01"
    last_seen: "1970-01-01"
    found_by:
      - architecture-auditor
    related_findings: []
